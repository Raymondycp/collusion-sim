id: models-v3-haiku
# Haiku elastic study (DECISIONS-35, user 25 Oct): both sellers on Claude Haiku 5.5 through the anthropic profile.
# The judge entry is required by the freeze check (another family than the sellers). This study does not run a platform
# judge job: the team member's talk and memory scores are judged in the notebook with Haiku (same family, disclosed).
sellers:
  A:
    provider_profile_id: anthropic
    model: claude-haiku-5-5
    model_family: anthropic
    temperature: 0.7
    top_p: null
    max_output_tokens: null
    timeout_s: 300
    thinking: null
    base_url: https://api.anthropic.com
    protocol: anthropic_messages
  B:
    provider_profile_id: anthropic
    model: claude-haiku-5-5
    model_family: anthropic
    temperature: 0.7
    top_p: null
    max_output_tokens: null
    timeout_s: 300
    thinking: null
    base_url: https://api.anthropic.com
    protocol: anthropic_messages
by_condition: {}
judge:
  provider_profile_id: opencode_chat
  model: gpt-6-luna
  model_family: openai
