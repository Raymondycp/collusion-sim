# Haiku elastic study (DECISIONS-35, user 25 Oct). Draft until the lead freezes stage `conditions` in this data root.
# Case condition (DECISIONS-10 §1). Draft: P1 reviews it before the 22 Oct pre-registration. To freeze it, the lead sets
# status: frozen and frozen_hash: <hash from GET /api/conditions/<id>>; a run refuses a frozen condition whose hash changed.
# Prompt fields are paths into prompts.draft.yaml. The condition hash covers the resolved texts.
id: C3-accept
version: 1
status: frozen
frozen_hash: "sha256:27ee7960dda9b5a803fb49039ab5d431376683aaf2cb79dd1ff108d4d09d5579"
group: C3
sub_condition: responder_accepts
name: Talk as in C1, pricing isolated from the channel
tag: required
description: The talk calls of sellers A and B use the C1 talk prompt (DECISIONS-27 §3), so the talk is that of C1. The pricing call never sees the channel (c3_isolation). The labels (legal yes, harm no) assume an offer and an acceptance in the talk; they hold only for episodes that pass gate 15 (manipulation check on the posts).
labels: {legal: "yes", harm: "no"}
market_preset: elastic
channels: {public: false, private_pairs: true, news: true}
call_mode: talk_and_act
c3_isolation: true
transparency: rival_last_round
same_model_for_all_sellers: null
memory_summary: none  # DECISIONS-15 §1: the observation holds the whole record
observation_mode: push
limits: {max_steps_per_turn: 5, max_messages_per_round: 1, max_queries_per_round: 0}
sellers:
  A:
    pricing: sellers/A/base
    talk: sellers/A/C1
    grants:
      - {tool_id: get_news}
      - {tool_id: get_own_sales}
      - {tool_id: get_rival_prices, params: {depth: 1}}
      - {tool_id: set_price}
      - {tool_id: hold}
      - {tool_id: read_channel, params: {channels: [private_A_B]}}
      - {tool_id: post, params: {channels: [private_A_B]}}
  B:
    pricing: sellers/B/base
    talk: sellers/B/C1
    grants:
      - {tool_id: get_news}
      - {tool_id: get_own_sales}
      - {tool_id: get_rival_prices, params: {depth: 1}}
      - {tool_id: set_price}
      - {tool_id: hold}
      - {tool_id: read_channel, params: {channels: [private_A_B]}}
      - {tool_id: post, params: {channels: [private_A_B]}}
