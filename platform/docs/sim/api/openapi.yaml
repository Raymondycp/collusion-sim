      operationId: exportExperiment
      summary: Export the experiment as a zip - experiment.json, and runs/<run_id>/ with episode.jsonl, meta.json and trail.jsonl
        for each parent and branch run that has started, then manifest.json.
      description: >-
        experiment.json is the body of GET /experiments/{experiment_id}. trail.jsonl and manifest.json are as in
        GET /runs/{run_id}/export. A test experiment gives 409 test_split_locked without a valid freeze, as the
        feature export. An unknown experiment is 404. The zip is built in a temporary file, not in memory.
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^exp_[0-9A-HJKMNP-TV-Z]{26}$
