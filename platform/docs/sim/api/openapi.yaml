  /schema/run-config:
    get:
      tags:
      - registry
      operationId: getRunConfigSchema
      summary: 'JSON Schema (2020-12) of a full RunConfig, built from the registries: demand models, roles, policies, tools (grant params), indicators.
        A new plug-in appears here with no frontend change.'
      description: 'Research-locked fields carry `x-research-locked: true`. Keys never appear: an LLM agent holds only provider_profile_id.
        Registry enums: `AgentConfig.role` (run roles that are built), `PolicySettings.kind`, `ToolGrant.tool_id`, `IndicatorRef.id`.
        The params schema of each choice is in `$defs.PolicySettings.x-params-by-kind`, `$defs.ToolGrant.x-params-by-tool` and
        `$defs.IndicatorRef.x-params-by-indicator` (keyed by kind, tool id or indicator id). Nullable fields use `anyOf: [X, {type:
        null}]`. Demand models are not a RunConfig field (the scenario sets the demand model; see GET /demand-models).'
