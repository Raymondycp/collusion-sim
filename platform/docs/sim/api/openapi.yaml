      - n_runs
      - per_run
      - calls_max
      - tokens_max
      - total_usd_max
      - pricing_missing_for
      - within_budget
      - rate_window
      - warnings
      - assumptions
      properties:
        call_mode:
          $ref: '#/components/schemas/CallMode'
        n_runs:
          type: integer
        per_run:
          type: object
          properties:
            max_rounds:
              type: integer
            calls:
              type: object
              properties:
                talk:
                  type: integer
                act:
                  type: integer
                one_call:
                  type: integer
                tool_turns:
                  type: integer
                summary:
                  type: integer
                total_max:
                  type: integer
            tokens_max:
              type: object
              properties:
                input:
                  type: integer
                output:
                  type: integer
            usd_max:
              type:
              - number
              - 'null'
        total_usd_max:
          type:
          - number
          - 'null'
          description: null if a profile has no pricing.
        expected_cache_hits:
          type: integer
        pricing_missing_for:
          type: array
          items:
            type: string
          description: Profile ids with no price.
        calls_max:
          type: integer
          description: All runs together.
        tokens_max:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        within_budget:
          type:
          - boolean
          - 'null'
          description: Every run's worst case fits every per-run cap. null when a max_usd check needs a missing price.
        rate_window:
          type: array
          description: One row per profile with max_calls_per_5h. Counted on this machine only.
          items:
            type: object
            properties:
              profile_id:
