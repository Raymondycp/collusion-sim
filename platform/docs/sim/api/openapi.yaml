        branches:
          type: array
          items:
            type: string
            enum:
            - probe
            - placebo
            - ablation
        code_hash:
          type: string
          description: sha256 over the feature's module, the view builder (features/table.py) and every repo module they import
    AblationIntervention:
      type: object
      description: 'ablated channel: one channel is cleared or shuffled from the fork (channel_id and mode set). ablated none: a null
        ablation (no channel_id, no mode) for a group with no private channel; nothing is removed, and the child draws fresh samples
        (sample_index from 1000), so its effect is the noise floor of the ablation effect. A real ablation child starts at sample 0
        and replays the parent until the first changed message (effect exactly 0 when no private message follows the fork); a null
        child never replays, so the C2 noise floor is wider than the noise in C1 and C3.'
      required:
      - type
      properties:
        type:
          const: ablation
        ablated:
          type: string
          enum:
          - channel
          - none
          default: channel
        channel_id:
          type:
          - string
          - 'null'
        mode:
          type:
          - string
          - 'null'
          enum:
          - clear
          - shuffle
          - null
    BranchRequest:
      type: object
      required:
      - at
      - rounds
      - n
      - intervention
      properties:
        at:
          type: number
          description: Fork time.
        rounds:
          type: integer
          minimum: 1
          description: Rounds to run after the fork.
        n:
          type: integer
          minimum: 1
          maximum: 10
        intervention:
          $ref: '#/components/schemas/Intervention'
        budget:
          $ref: '#/components/schemas/BudgetSettings'
          description: Replaces the parent's budget for each child. Omitted = the parent's budget.
    RunSeries:
      type: object
      required:
      - run_id
      - t
      - sellers
      - reference
      - markers
      description: One value per round. Arrays are aligned with `t`. null where a value does not exist.
      properties:
        run_id:
          type: string
        t:
          type: array
          items:
            type: number
        sellers:
          type: object
          additionalProperties:
            type: object
            properties:
              price:
                type: array
                items:
                  type:
                  - number
                  - 'null'
              quantity:
                type: array
                items:
                  type:
                  - number
                  - 'null'
              profit:
                type: array
                items:
                  type:
                  - number
                  - 'null'
              best_response:
                type: array
                items:
                  type:
                  - number
                  - 'null'
              fallback:
                type: array
                items:
                  type: boolean
              forced:
                type: array
                items:
                  type: boolean
                description: Price set by the host (probe).
        reference:
          type: object
          properties:
            nash:
              type: array
              items:
                type: number
            joint_optimum:
              type: array
              items:
                type: number
        consumer_surplus:
          type: array
          items:
            type:
            - number
            - 'null'
        markers:
          type: array
          items:
            $ref: '#/components/schemas/ChartMarker'
    ChartMarker:
      type: object
      required:
      - t
      - kind
      - seq
      properties:
        t:
          type: number
        kind:
          type: string
          enum:
          - news
          - post
          - probe
          - ablation
          - placebo
          - fallback
          - fork
          - budget
        agent_id:
          type:
          - string
          - 'null'
        channel_id:
          type:
          - string
          - 'null'
        text:
          type: string
          description: Short label. Full text is in the event.
        seq:
          type: integer
          description: The event this marker comes from.
    ObservationRecord:
      type: object
      required:
      - run_id
      - agent_id
      - t
      - observation
      - calls
      properties:
        run_id:
          type: string
        agent_id:
          type: string
        t:
          type: number
        observation:
          $ref: '#/components/schemas/Observation'
        calls:
          type: array
          items:
            type: object
            properties:
              purpose:
                $ref: '#/components/schemas/CallPurpose'
              request_hash:
                type: string
              messages:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
              tools:
                type: array
                items:
                  $ref: '#/components/schemas/ToolDefinition'
              response:
                $ref: '#/components/schemas/ChatMessage'
              cache_hit:
                type: boolean
    Observation:
      type: object
      description: What View returned (push part). Pull results are in tool_called events.
      properties:
        t:
          type: number
        own:
          type: object
          properties:
            last_price:
              type:
              - number
              - 'null'
            last_quantity:
              type:
              - number
              - 'null'
            last_profit:
              type:
              - number
              - 'null'
            last_price_set_by_system:
              type: boolean
              description: true when the system set the agent's last price (a probe, or a fallback hold after a failed call).
        new_message_count:
          type: integer
        headlines:
          type: array
          items:
            type: string
        masked:
          type: array
          items:
            type: string
          description: Parts that View removed, for example channels (c3_isolation) or messages (ablation). In
            observation_mode pull, channels and news, and every field except t and own is empty.
        rival_last_prices:
          type:
          - object
          - 'null'
          additionalProperties:
            type: number
          description: >-
            0.18.0. Each rival's price last round, by seller id. Only for an agent with the get_rival_prices grant
            (transparency rival_last_round); empty otherwise and in round 1. Null in episodes stored before 0.18.0,
            and then left out of the episode hash line, so those episodes re-hash to their stored episode_hash.
        new_messages:
          type:
          - array
          - 'null'
          description: >-
            0.18.0. The messages from other agents delivered this round, from the channels View lets it read in this
            call (the same filter, masks and c3_isolation as read_channel). new_message_count is their number; before
            0.18.0 it also counted the agent's own messages. Null in episodes stored before 0.18.0 (left out of the
            episode hash line, as rival_last_prices).
          items:
            type: object
            required:
            - channel_id
            - sender
            - text
            properties:
              channel_id:
                type: string
              sender:
                type: string
              text:
                type: string
        news:
          type:
          - array
          - 'null'
          description: >-
            0.23.0 (CR-58). Every news item the agent may see, from round 1, with the round of each (DECISIONS-15 §1;
            before it the last 5, what get_news returns), so a C2a item stays visible after its round. Empty without the get_news grant.
            Null in episodes stored before 0.23.0 (left out of the episode hash line, as rival_last_prices).
          items:
            type: object
            required:
            - t
            - text
            properties:
              t:
                type: integer
              text:
                type: string
        recent_messages:
          type:
          - array
          - 'null'
          description: >-
            0.23.0 (CR-58). Every message delivered so far, from round 1, on the channels View lets the agent read in
            this call, its own included, in delivery order (DECISIONS-15 §1; before it the last 6): the same filter, masks and c3_isolation as read_channel, so a C3 act
            call gets none. Null in episodes stored before 0.23.0 (left out of the episode hash line, as
            rival_last_prices).
          items:
            type: object
            required:
            - channel_id
            - t
            - deliver_t
            - sender
            - text
            properties:
              channel_id:
                type: string
              t:
                type: integer
                description: Round it was posted.
              deliver_t:
                type: integer
              sender:
                type: string
              text:
                type: string
        own_history:
          type:
          - array
          - 'null'
          description: >-
            0.23.0 (CR-60). The agent's price, quantity and profit for every round so far, the last round included
            (own.last_* repeats it; DECISIONS-15 §1, before it the last 5, what get_own_sales returns). Empty without the get_own_sales grant and in round 1. Null in episodes stored
            before 0.23.0 (left out of the episode hash line, as rival_last_prices).
          items:
            type: object
            required:
            - t
            - price
            - quantity
            - profit
            - set_by_system
            properties:
              t:
                type: integer
              price:
                type: number
              quantity:
                type: number
              profit:
                type: number
              set_by_system:
                type: boolean
        mask_noop:
          type:
          - boolean
          - 'null'
          description: >-
            0.23.0 (CR-60 n1, n4). True when a shuffle ablation mask is active on a channel this call reads but the
            other senders' messages visible there have fewer than 2 distinct texts (none, one, or all equal), so the
            mask changed nothing; false otherwise. For the
            manipulation check, which counts these rounds. Null in episodes stored before 0.23.0 (left out of the
            episode hash line, as rival_last_prices).
        rival_history:
          type:
          - object
          - 'null'
          description: >-
            DECISIONS-15 §1. Each rival's price for every round so far, by agent id, only with the get_rival_prices
            grant (an empty object without it). Null in episodes stored before it (left out of the episode hash line,
            as rival_last_prices).
          additionalProperties:
            type: array
            items:
              type: object
              required:
              - t
              - price
              properties:
                t:
                  type: integer
                price:
                  type: number
    ToolCallRecord:
      type: object
      required:
      - id
      - name
      - arguments
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
    FilesTree:
      type: object
      required:
      - roots
      properties:
        roots:
          type: array
          items:
            type: object
            required:
            - path
            - entries
            properties:
              path:
                type: string
              entries:
                type: array
                items:
                  type: object
                  required:
                  - path
                  - kind
                  - size
                  properties:
                    path:
                      type: string
                      description: Relative to SIM_ROOT, with slashes.
                    kind:
                      type: string
                      enum:
                      - file
                      - dir
                    size:
                      type: integer
                      description: Bytes; 0 for a folder.
    FilesZip:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          items:
            type: object
            required:
            - name
            - size
            properties:
              name:
                type: string
              size:
                type: integer
                description: Uncompressed bytes.
    LedgerEntry:
      type: object
      required:
      - line
      - run_id
      - kind
      - status
      - config_hash
      - created_at
      - prev_hash
      - hash
      properties:
        line:
          type: integer
        run_id:
          type: string
        batch_id:
          type: string
          pattern: ^batch_[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          $ref: '#/components/schemas/RunKind'
        status:
          $ref: '#/components/schemas/RunStatus'
        condition_id:
          type:
          - string
          - 'null'
          description: null for exploratory runs and for ablation children (they leave the condition; see parent_labels).
        split:
          $ref: '#/components/schemas/Split'
        seed:
          type: integer
        config_hash:
          type: string
        scenario_hash:
          type: string
        episode_hash:
          type:
          - string
          - 'null'
        cost_usd:
          type: number
        created_at:
          type: string
          format: date-time
        prev_hash:
          type: string
        hash:
          type: string
        preset_id:
          type:
          - string
          - 'null'
        cloned_from:
          type:
          - string
          - 'null'
        demand:
          type: string
          enum:
          - formula
          - agent
        reproducible:
          type: boolean
        models:
          type: array
          items:
            type: string
          description: Distinct LLM models of the run's agents.
        parent_labels:
          oneOf:
          - $ref: '#/components/schemas/Labels'
          - type: 'null'
          description: Ablation children only. The labels of the run the ablation started from. Such a child has condition_id null, so it is never counted in a case group.
    EpisodeHeader:
      type: object
      description: Line 1 of episode.jsonl. P2 reviews this schema.
      required:
      - schema_version
      - run_id
      - kind
      - labels
      - split
      - seed
      - scenario
      - agents
      - seller_order
      - channels
      - call_mode
      - c3_isolation
      - clock
      - max_rounds
      - demand
      - reproducible
      - simcore_version
      - created_at
      properties:
        schema_version:
          type: string
          enum:
          - episode.v4
          - episode.v5
          description: v5 adds talk_replied, talk_text and two Observation fields. Readers accept v4 and v5.
        run_id:
          type: string
        batch_id:
          type: string
          pattern: ^batch_[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          $ref: '#/components/schemas/RunKind'
        condition_id:
          type:
          - string
          - 'null'
        condition_hash:
          type:
          - string
          - 'null'
        labels:
          oneOf:
          - $ref: '#/components/schemas/Labels'
          - type: 'null'
        parent_labels:
          oneOf:
          - $ref: '#/components/schemas/Labels'
          - type: 'null'
          description: Ablation children only (labels is null). The parent's labels. Such a child is dependence evidence, never a member of a case group. Probe and placebo children keep the parent's labels in labels.
        label_source:
          enum:
          - condition_config
          - null
        split:
          $ref: '#/components/schemas/Split'
        seed:
          type: integer
        seeds_hash:
          type:
          - string
          - 'null'
        scenario:
          $ref: '#/components/schemas/ScenarioRef'
        branch:
          oneOf:
          - $ref: '#/components/schemas/BranchInfo'
          - type: 'null'
        agents:
          type: array
          items:
            type: object
            required:
            - id
            - role
            - policy_kind
            - capability
            properties:
              id:
                type: string
              role:
                type: string
              policy_kind:
                $ref: '#/components/schemas/PolicyKind'
              provider_profile_id:
                type:
                - string
                - 'null'
                description: Reference only. Never a key.
              base_url_host:
                type:
                - string
                - 'null'
                description: Host name only, for example api.openai.com.
              protocol:
                type:
                - string
                - 'null'
                description: Wire protocol of the profile when the run started.
              base_path:
                type:
                - string
                - 'null'
                description: Path of the base URL, without query (never a key), for example /inference/go/openai/v1.
              price:
                type:
                - object
                - 'null'
                description: The profile price frozen when the run started. source unknown means no price; calls then record cost_usd null.
                properties:
                  input_usd_per_mtok:
                    type:
                    - number
                    - 'null'
                  output_usd_per_mtok:
                    type:
                    - number
                    - 'null'
                  cached_input_usd_per_mtok:
                    type:
                    - number
                    - 'null'
                  source:
                    type: string
                    enum:
                    - user
                    - unknown
                  as_of:
                    type: string
              model:
                type:
                - string
                - 'null'
              temperature:
                type:
                - number
                - 'null'
              prompt_hash:
                type:
                - string
                - 'null'
              capability:
                $ref: '#/components/schemas/Capability'
        seller_order:
          type: array
          items:
            type: string
          description: Order in which sellers are called each round (from the seed).
        channels:
          type: array
          description: Chat channels. News is not a channel; it is in news_published events.
          items:
            type: object
            properties:
              id:
                type: string
              kind:
                type: string
                enum:
                - public
                - private
              participants:
                type: array
                items:
                  type: string
        call_mode:
          $ref: '#/components/schemas/CallMode'
        clock:
          $ref: '#/components/schemas/ClockSettings'
        simcore_version:
          type: string
        code_commit:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        c3_isolation:
          type: boolean
        max_rounds:
          type: integer
          description: Last round of this run (the seeded stop round, or fork_t + rounds − 1 for a branch). Agents never see it.
        demand:
          type: string
          enum:
          - formula
          - agent
          description: agent = buyer agents set demand; then no layer-B reference values exist.
        reproducible:
          type: boolean
          description: false if a non-scripted host took part.
        preset_id:
          type:
          - string
          - 'null'
        config_hash:
          type:
          - string
          - 'null'
        cloned_from:
          type:
          - string
          - 'null'
          description: Run id this run was cloned from.
        memory_summary:
          type: string
          enum:
          - code
          - llm
          - none
          default: code
        observation_mode:
          type:
          - string
          - 'null'
          enum:
          - push
          - pull
          - both
          - null
          description: How the sellers got their information (DECISIONS-15 §3.2; RunConfig.observation_mode). Null in runs recorded
            before this field (they ran as both); left out of the episode hash when null.
        limits:
          oneOf:
          - $ref: '#/components/schemas/RunLimits'
          - type: 'null'
          description: null in runs recorded before contract 0.9.0.
    EventBase:
      type: object
      required:
      - seq
      - run_id
      - type
      - t
      - wall_time
      properties:
        seq:
          type: integer
          minimum: 0
          description: 'Gap-free within a run: 0, 1, 2, … in write order. Branch children start again at 0.'
        run_id:
          type: string
        type:
          type: string
        t:
          type: number
          description: Round (sync) or simulated time (event mode).
        wall_time:
          type: string
          format: date-time
        tier:
          type: string
          enum:
          - A
          - B
          - C
          description: Data tier (plan §14). Evidence code may read tier C only for the manipulation check.
    SimEvent:
      oneOf:
      - $ref: '#/components/schemas/RunStartedEvent'
      - $ref: '#/components/schemas/RoundStartedEvent'
      - $ref: '#/components/schemas/NewsPublishedEvent'
      - $ref: '#/components/schemas/ObservedEvent'
      - $ref: '#/components/schemas/LlmCallEvent'
      - $ref: '#/components/schemas/ToolCalledEvent'
      - $ref: '#/components/schemas/PostedEvent'
      - $ref: '#/components/schemas/TalkRepliedEvent'
      - $ref: '#/components/schemas/TalkTextEvent'
      - $ref: '#/components/schemas/ActedEvent'
      - $ref: '#/components/schemas/PlannedEvent'
      - $ref: '#/components/schemas/SettledEvent'
      - $ref: '#/components/schemas/ReferenceEvent'
      - $ref: '#/components/schemas/OutcomeEvent'
      - $ref: '#/components/schemas/MemorySummarisedEvent'
      - $ref: '#/components/schemas/IntervenedEvent'
      - $ref: '#/components/schemas/SnapshotSavedEvent'
      - $ref: '#/components/schemas/BudgetWarningEvent'
      - $ref: '#/components/schemas/RunStatusChangedEvent'
      - $ref: '#/components/schemas/RunEndedEvent'
