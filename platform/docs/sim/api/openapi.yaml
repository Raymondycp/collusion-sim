openapi: 3.1.0
info:
  title: Market simulator API
  version: 0.45.0
  summary: Contract between the simulator backend (de) and the frontend (fe).
  description: "Local, single-user API for the Apart 2.3 market simulator.\nRead `docs/sim/api/README.md` first. Design: `docs/sim/DESIGN-QUESTIONS.md`\
    \ (v2).\n\nRules that the contract enforces:\n- API keys are write-only. No response, event, error or file ever contains a key.\n  A response\
    \ shows only `key_hint` (for example `sk-…a1b2`).\n- Labels come only from condition files. No endpoint accepts a label.\n- A run reads only\
    \ a frozen scenario (by id and hash).\n- Exploratory runs have `labels: null` and can never use dev or test seeds.\n- The judge is not part\
    \ of the simulator. Nothing here scores collusion.\n\nThe WebSocket channel is not an OpenAPI path. It is described in `x-websocket` below\n\
    and in the README. Its messages use the schemas `WsServerMessage` and `SimEvent`.\nThe same `SimEvent` objects are the lines of `episode.jsonl`\
    \ (schema v2).\n"
  license:
    name: Internal draft, not yet licensed
servers:
- url: http://127.0.0.1:8000/api
  description: Local backend. Binds to 127.0.0.1 only.
tags:
- name: system
- name: provider-profiles
  description: OpenAI-compatible endpoints and their keys (stored server side only).
- name: market
  description: Market types and reference-price preview.
- name: scenarios
  description: Draft, check, AI help, freeze. Frozen scenarios are read-only.
- name: conditions
  description: Research conditions (read-only, from conditions/*.yaml).
- name: seeds
- name: experiments
  description: Conditions × seeds × branch plan, with one batch budget.
- name: agents
  description: Policy catalogue (per role) and prompt preview.
- name: runs
- name: branches
- name: records
  description: Events, chart series, observations, export.
- name: files
  description: Read-only files for the web file browser (DECISIONS-33).
- name: ledger
- name: indicators
  description: Plug-in indicators computed from recorded events (plan Fig. 1e).
- name: registry
  description: Roles, tools and the run-config JSON Schema built from all registries.
- name: presets
- name: evaluations
  description: Judge jobs after a run. They read episode.jsonl only and write to the evaluation store.
x-websocket:
  path: /ws/runs/{run_id}
  url_example: ws://127.0.0.1:8000/api/ws/runs/run_01JB7X3K2M?from_seq=0
  query:
    from_seq: Integer, default 0. The server first replays stored events with seq >= from_seq, then streams live events.
  direction: Mostly server to client. The client may send `subscribe` / `unsubscribe` (indicators) and `pong`. Run control uses REST. Replay speed
    is the client's job; stored events arrive as fast as the socket allows.
  server_messages: '#/components/schemas/WsServerMessage'
  client_messages: '#/components/schemas/WsClientMessage'
  heartbeat: Server sends `ping` every 15 s. Client may reply `pong`. Client reconnects with from_seq = last seq + 1.
  close_codes:
    '1000': Run ended and all events were sent.
    '1007': A client message is not valid JSON.
    '4404': Run not found.
    '4409': from_seq is greater than the last stored seq + 1.
paths:
  /health:
    get:
      tags:
      - system
      operationId: getHealth
      summary: Backend status and versions.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                api_version: 0.5.0
                simcore_version: 0.1.0
                schema_version: episode.v5
                durable_backend: dbos
                paid_calls_enabled: false
                freeze:
                  frozen: false
                  frozen_at: null
  /freeze:
    get:
      tags:
      - system
      operationId: getFreeze
      summary: State of the rule freeze (frozen.json, owned by P2). Test seeds need a valid freeze.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeStatus'
              example:
                frozen: false
                frozen_at: null
                valid: false
                problems:
                - frozen.json not found
    post:
      tags:
      - system
      operationId: postFreeze
      summary: Freeze one stage of the research inputs (DECISIONS-11 §2.5). Never commits; the lead commits the files.
      description: |-
        Stage `conditions` needs `judge-rubric.yaml` as a valid item set with no `TEAM TO WRITE` text (else 409 `freeze_incomplete`, with
        the field paths in `errors`) and `models.yaml` (CR-43 M1, CR-47) as a valid models file: no `TEAM TO WRITE` text, base_url
        and protocol in every entry and equal to the profile's now, no condition id or seller id that matches no condition, an entry
        for each seller of each condition, the same profile, model and model_family for C2a, a different model_family per LLM seller
        for C2b, and a judge model_family that no LLM seller has (else 409 `freeze_incomplete`, with the field paths in `errors`). The
        conditions must differ only in their channels (DECISIONS-15 §3.4): the same observation_mode, transparency, call_mode,
        memory_summary, news switch, limits and every grant except read_channel and post, with its params, per seller (else 409
        `freeze_incomplete`, each difference in `errors` with path `<condition id>/<field>`, compared with the first condition by
        id). It checks every input, sets `status: frozen` and
        `frozen_hash` in each condition file, and stores the hashes of every condition, `seeds.yaml`, every seed scenario, the feature
        code (`features`), `judge_rubric` (item 3 L1: the judge scores dev episodes) and `models`. It opens dev. A new conditions stage
        removes the rule stage. Stage `rule` needs a valid conditions stage (else 409 `conflict`) and `decision-rule.yaml` with no `TEAM
        TO WRITE` text (else 409 `freeze_incomplete`); it stores every hash of the conditions stage plus `decision_rule`, and opens test. Dev may tune the
        rule before its stage. Both stages: 409 `hash_mismatch` when a seed scenario
        does not match the seed map, 409 `features_changed` when a feature file changed after the server started (restart it), 409
        `conflict` once a test cell is used. `conditions/frozen.json` holds `{stages: {conditions, rule}}`, each with `frozen_at`,
        `approved_by` and `hashes`. The gates compute every hash again from the files at each request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - stage
              - approved_by
              properties:
                stage:
                  type: string
                  enum:
                  - conditions
                  - rule
                approved_by:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: The new freeze status, with the stored hashes
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/FreezeStatus'
                - type: object
                  required:
                  - hashes
                  properties:
                    hashes:
                      type: object
                      additionalProperties:
                        type: string
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /research/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
        enum:
        - decision-rule
        - judge-rubric
        - models
    get:
      tags:
      - system
      operationId: getResearchFile
      summary: P2's decision rule, the judge rubric or the models file (conditions/decision-rule.yaml, judge-rubric.yaml, models.yaml).
        Text, hash, time.
      description: A missing file gives 200 with text, hash and updated_at null. Stage conditions needs the judge rubric and the
        models file; stage rule needs the decision rule.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '422':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - system
      operationId: putResearchFile
      summary: Save the decision rule, the judge rubric or the models file from the web UI (DECISIONS-11 §1). Any valid YAML; the server
        writes the file.
      description: 422 validation_error when the text is not YAML. Line ends are
        stored as LF. The hash is the hash that the freeze stores. The judge rubric freezes with stage conditions (item 3 L1), so it
        gives 409 research_frozen once that stage is frozen. The decision rule may change until a test cell is used (409
        research_frozen then; CR-29 m1). A rule change after stage rule makes that stage invalid, so test locks again until stage
        rule is frozen again; the answer then gives invalidated_stage = rule. The models file freezes with stage conditions too
        (409 research_frozen after it). Its keys are id, sellers (per seller id, an entry or "scripted"), by_condition (per condition
        id, overrides per seller id) and judge (an entry); an entry has provider_profile_id, model and model_family, and a seller
        entry also has temperature, top_p, max_output_tokens, timeout_s and thinking, all required; top_p, max_output_tokens and thinking may be null (CR-47 M1, DECISIONS-18 entries 2 and 3). "scripted" means a scripted
        policy of any kind and parameters; only real LLM runs are pinned. At PUT the server sets base_url and protocol of each entry
        from its provider profile (422 validation_error, path .../provider_profile_id, for an unknown profile or a base_url with a user
        name, a password or a query) and writes the file as YAML again, so comments are not kept. The key is never in the file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextBody'
      responses:
        '200':
          description: The saved file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /conditions/{condition_id}/file:
    parameters:
    - name: condition_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - research
      operationId: getConditionFile
      summary: The YAML text of one condition file, its text hash and the time of the last save.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - research
      operationId: putConditionFile
      summary: Save a draft condition file from the web UI (DECISIONS-11 §1). Every save writes the YAML file, so git shows the diff.
      description: The text must be a valid condition with the same id, `status` draft and `frozen_hash` null, and its prompt paths must
        resolve (else 422 validation_error with paths). 409 condition_frozen once the condition is frozen; POST /freeze freezes every
        condition. 404 for an unknown id (no new conditions here).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextBody'
      responses:
        '200':
          description: The saved file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /budget:
    get:
      tags:
      - system
      operationId: getBudget
      summary: Total spend across all runs (from the ledger) and the global cap.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetStatus'
              example:
                cap_usd: 50.0
                spent_usd: 3.42
                calls: 812
                cache_hits: 240
  /defaults:
    put:
      tags:
      - system
      operationId: putDefaults
      summary: Save the defaults from the web UI (DECISIONS-11 §1). The same body as GET; a role sent here replaces that role's .env values.
      description: Stored in the data root (defaults.json). Roles left out keep their .env values. Every profile_id must name an existing
        provider profile (else 422 validation_error with the path); a default never holds a key. Returns GET /defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Defaults'
      responses:
        '200':
          description: The defaults now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defaults'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      tags:
      - system
      operationId: getDefaults
      summary: Default profile and model per role from SIM_DEFAULT_* (DECISIONS-9 §16). They only pre-fill the run form, the CLI and presets.
      description: 'Read from a fixed allow-list of variable names: SIM_DEFAULT_<ROLE>_PROFILE and SIM_DEFAULT_<ROLE>_MODEL for ROLE in SELLER,
        JUDGE, JUDGE2, HOST_LLM, and SIM_DEFAULT_<ROLE>_<AGENT>_PROFILE / _MODEL for a one-letter agent id A to Z. Nothing reads a default at
        run time; research runs ignore them.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defaults'
              example:
                seller:
                  profile_id: opencode_chat
                  model: kimi-k2
                  agents:
                    B:
                      profile_id: null
                      model: glm-4.6
                judge:
                  profile_id: opencode_chat
                  model: jev-1.13
                  agents: {}
                judge2:
                  profile_id: null
                  model: null
                  agents: {}
                host_llm:
                  profile_id: null
                  model: null
                  agents: {}
  /provider-profiles:
    get:
      tags:
      - provider-profiles
      operationId: listProviderProfiles
      summary: List profiles. Keys are never returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderProfile'
              example:
              - id: prof_openai_main
                name: OpenAI main
                base_url: https://api.openai.com/v1
                key_set: true
                key_hint: sk-…a1b2
                key_store: keyring
                default_model: gpt-4o-mini
                pricing:
                  input_usd_per_mtok: 0.15
                  output_usd_per_mtok: 0.6
                supports:
                  tool_calls: true
                  json_schema: true
                  checked_at: '2026-10-21T10:02:00Z'
                max_concurrency: 4
                created_at: '2026-10-21T10:00:00Z'
    post:
      tags:
      - provider-profiles
      operationId: createProviderProfile
      summary: Create a profile. The key is sent here once and stored server side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileCreate'
            example:
              name: OpenAI main
              base_url: https://api.openai.com/v1
              api_key: sk-EXAMPLE-NOT-A-REAL-KEY
              default_model: gpt-4o-mini
              pricing:
                input_usd_per_mtok: 0.15
                output_usd_per_mtok: 0.6
              max_concurrency: 4
      responses:
        '201':
          description: Created. The response has no key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '422':
          $ref: '#/components/responses/Problem'
  /provider-profiles/{profile_id}:
    parameters:
    - $ref: '#/components/parameters/ProfileId'
    get:
      tags:
      - provider-profiles
      operationId: getProviderProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - provider-profiles
      operationId: updateProviderProfile
      summary: Change fields. Send `api_key` only to replace the key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileUpdate'
            example:
              pricing:
                input_usd_per_mtok: 0.2
                output_usd_per_mtok: 0.8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - provider-profiles
      operationId: deleteProviderProfile
      summary: Delete the profile and its stored key. Past runs keep the profile id as a reference.
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /provider-profiles/{profile_id}/test:
    post:
      tags:
      - provider-profiles
      operationId: testProviderProfile
      summary: Make one small call to the endpoint (no output limit, 300 s deadline, optional thinking). Detects tool-call and JSON-schema support. Costs one call.
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: Defaults to the profile default_model.
                thinking:
                  description: The unified thinking setting for this call (as a model's thinking field). Unset by default.
                  oneOf:
                  - type: boolean
                  - type: string
                    enum:
                    - minimal
                    - low
                    - medium
                    - high
                    - xhigh
      responses:
        '200':
          description: Test result. Errors from the provider are redacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileTestResult'
              example:
                ok: true
                model: gpt-4o-mini
                latency_ms: 640
                supports:
                  tool_calls: true
                  json_schema: true
                  checked_at: '2026-10-21T10:02:00Z'
                error: null
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: Costs one LLM call. Refused with 409 paid_calls_disabled unless the server runs with SIM_ALLOW_PAID=1 (lead approval).
  /provider-profiles/{profile_id}/models:
    get:
      tags:
      - provider-profiles
      operationId: listProfileModels
      summary: Model ids from the endpoint's GET /models, if the endpoint has it.
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - models
                properties:
                  models:
                    type: array
                    items:
                      type: string
                  available:
                    type: boolean
                    description: false if the endpoint has no /models.
              example:
                models:
                - gpt-4o-mini
                - gpt-4o
                available: true
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /market/preview:
    post:
      tags:
      - market
      operationId: previewMarket
      summary: Reference prices per round for a draft market and event list. Pure calculation, no LLM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - n_sellers
              - rounds
              properties:
                market:
                  $ref: '#/components/schemas/MarketSpec'
                n_sellers:
                  type: integer
                  minimum: 2
                  maximum: 6
                rounds:
                  type: integer
                  minimum: 1
                  maximum: 200
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/ScenarioEvent'
            example:
              market:
                demand:
                  id: linear
                  version: '1'
                  params:
                    a: 10
                    b: 1.5
                    d: 1.0
                    c: 1.0
                    c_offset: {}
                grid:
                  min: 0
                  max: 15
                  step: 0.05
              n_sellers: 2
              rounds: 3
              events: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPreview'
              example:
                rounds:
                - t: 1
                  params:
                    a: 10
                    b: 1.5
                    d: 1.0
                    c: 1.0
                  nash: 5.75
                  joint_optimum: 10.5
                  nash_profit: 33.84
                  joint_profit: 45.13
                - t: 2
                  params:
                    a: 10
                    b: 1.5
                    d: 1.0
                    c: 1.0
                  nash: 5.75
                  joint_optimum: 10.5
                  nash_profit: 33.84
                  joint_profit: 45.13
                - t: 3
                  params:
                    a: 10
                    b: 1.5
                    d: 1.0
                    c: 1.0
                  nash: 5.75
                  joint_optimum: 10.5
                  nash_profit: 33.84
                  joint_profit: 45.13
                checks:
                - id: stability
                  ok: true
                  message: q >= 0 for all grid prices
  /scenarios:
    get:
      tags:
      - scenarios
      operationId: listScenarios
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ScenarioStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
              example:
              - id: scn_cost_shock_v1
                name: Cost shock
                status: frozen
                hash: sha256:9f2c…e1
                n_sellers: 2
                n_events: 3
                updated_at: '2026-10-21T11:00:00Z'
              - id: scn_draft_holiday
                name: Holiday demand
                status: draft
                hash: null
                n_sellers: 2
                n_events: 1
                updated_at: '2026-10-21T11:30:00Z'
    post:
      tags:
      - scenarios
      operationId: createScenario
      summary: Create a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioDraft'
            examples:
              cost_shock:
                $ref: '#/components/examples/ScenarioDraftExample'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '422':
          $ref: '#/components/responses/Problem'
  /scenarios/{scenario_id}:
    parameters:
    - $ref: '#/components/parameters/ScenarioId'
    get:
      tags:
      - scenarios
      operationId: getScenario
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
              examples:
                frozen:
                  $ref: '#/components/examples/ScenarioFrozenExample'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - scenarios
      operationId: replaceScenario
      summary: Replace a draft. Returns 409 `scenario_frozen` for a frozen scenario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioDraft'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - scenarios
      operationId: deleteScenario
      summary: Delete a draft. Frozen scenarios cannot be deleted (409).
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Problem'
  /scenarios/{scenario_id}/check:
    post:
      tags:
      - scenarios
      operationId: checkScenario
      summary: Run all automatic checks on a draft. No LLM call.
      parameters:
      - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Check report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckReport'
              example:
                ok: false
                checks:
                - id: stability
                  ok: true
                  message: q >= 0 for all grid prices
                - id: quiet_window
                  ok: true
                  message: No event effect in rounds 18–25
                - id: news_direction
                  ok: false
                  event_index: 0
                  message: 'Event 0: delta +0.5 on c, but the news text says prices fell'
  /scenarios/{scenario_id}/generate-news:
    post:
      tags:
      - scenarios
      operationId: generateScenarioNews
      summary: AI writes news text for each event of a draft, from the numbers. The check runs after. Costs LLM calls.
      parameters:
      - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAssistRequest'
            example:
              provider_profile_id: prof_openai_main
              model: gpt-4o-mini
              event_indices: null
              style: short business news, one sentence
      responses:
        '200':
