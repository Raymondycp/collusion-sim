  /imports:
    post:
      tags:
      - runs
      operationId: createImport
      summary: Store an outside conversation log as a completed exploratory run (QUEUE "Log import", DECISIONS-14 §3.3).
      description: The log becomes an episode.v5 with tier-A events only (posted, acted, settled with the prices of the
        sellers that acted, quantities and profits only when the log gives them) and a trail.jsonl (one trail.v1 line per
        call or row with text or thinking; seq null, source pi or rows; key-like strings such as sk-... or api_key values
        are redacted before it is stored). Each seller has the grants set_price, hold and post on the channels it posted
        on; a private channel id names its pair in sorted order (private_B_A is stored as private_A_B). Prices and
        quantities are finite and 0 or more, and rounds are 1 to 1000; other input is 422 validation_error. The run is exploratory with split exploratory and
        seed 0; its sellers have policy kind imported and its summary has source import. It has no market state, so
        branches are refused (409) and features that need the payoff model or a branch are missing. The run id comes from
        the files' hash, so the same files again return the stored run with 200 and created false. The run gets its run
        folder runs/<run_id>/ with manifest.json, as a simulator run does (DECISIONS-20; CR-86 minor 4); the same files again
        write the folder when it has no manifest. The judge block `imported` judges such runs. No LLM call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCreate'
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '200':
          description: The same files were imported before; nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '422':
          $ref: '#/components/responses/Problem'
