        notes:
          type: string
    AgentConfig:
      type: object
      required:
      - id
      - role
      - policy
      properties:
        id:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,15}$
          description: Sellers use A, B, C …; the host uses host.
        role:
          type: string
          description: A role from GET /roles with stage run and built true.
        display_name:
          type: string
        policy:
          type: object
          required:
          - kind
          properties:
            kind:
              $ref: '#/components/schemas/PolicyKind'
            llm:
              $ref: '#/components/schemas/LlmSettings'
            params:
              type: object
              description: Scripted policy parameters (see GET /policies).
              additionalProperties: true
        capability:
          oneOf:
          - $ref: '#/components/schemas/Capability'
          - type: 'null'
          description: Exploratory runs set this. Research runs leave it null (the condition sets it).
    IndicatorOutputSpec:
      type: object
      required:
      - name
      - kind
      - unit
      properties:
        name:
          type: string
          description: May hold {seller} or {pair}; series responses give expanded names (delta_p.A, corr.A_B).
        kind:
          type: string
          enum:
          - line
          - histogram
          - marker
          - band
        unit:
          type: string
    IndicatorSpec:
      type: object
      required:
      - id
      - version
      - name
      - description
      - params_schema
      - inputs
      - data_layer
      - pane
      - outputs
      properties:
        id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
        params_schema:
          type: object
          additionalProperties: true
          description: JSON Schema of the params. Only flat primitive properties (integer, number, boolean, string with optional enum), each with
            default and title. The UI builds its form from it.
        inputs:
          type: array
          items:
            type: string
          description: 'Recorded series it reads: price.*, quantity.*, profit.*, posts.*, queries.* (layer A, from settled, posted, tool_called); nash.*, joint_optimum.*, best_response.* (layer B, from the reference event).'
        data_layer:
          type: string
          enum:
          - A
          - B
          description: A = logs only. B = needs reference values. Layer C (plan text) is never an input.
        pane:
          type: string
          enum:
          - overlay
          - separate
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorOutputSpec'
    FoldedSeller:
      type: object
      required:
      - price
      - quantity
      - profit
      - cumulative_profit
      - set_by_system
      properties:
        price:
          type:
          - number
          - 'null'
        quantity:
          type:
          - number
          - 'null'
        profit:
          type:
          - number
          - 'null'
        cumulative_profit:
          type: number
        set_by_system:
          type: boolean
    FoldedState:
      type: object
      required:
      - run_id
      - t
      - last_seq
      - sellers
      - messages
      - news
      - masks
      properties:
        run_id:
          type: string
        t:
          type: integer
        last_seq:
          type: integer
          description: Seq of the snapshot_saved event of round t. Resume the WebSocket at last_seq + 1.
        snapshot_hash:
          type:
          - string
          - 'null'
        reference:
          oneOf:
          - $ref: '#/components/schemas/ReferencePoint'
          - type: 'null'
        sellers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FoldedSeller'
        messages:
          type: array
          description: All messages posted up to round t (the record, not one agent's view).
          items:
            type: object
            properties:
              id:
                type: integer
              t:
                type: integer
              channel_id:
                type: string
              sender:
                type: string
              text:
                type: string
              deliver_t:
                type: integer
        news:
          type: array
          items:
            type: object
            properties:
              t:
                type: integer
              event_index:
                type: integer
              text:
                type: string
              visible:
                type: array
                items:
                  type: string
        masks:
          type: array
          items:
            type: object
            properties:
              channel_id:
                type: string
              mode:
                type: string
                enum:
                - clear
                - shuffle
              from_t:
                type: integer
    Preset:
      type: object
      required:
      - id
      - name
      - version
      - hash
      - config
      - created_at
      properties:
        id:
          type: string
          pattern: ^pre_[a-z0-9_]+$
        name:
          type: string
        version:
          type: integer
          minimum: 1
        hash:
          type: string
          description: sha256 of the canonical config JSON.
        config:
          $ref: '#/components/schemas/RunConfig'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
    PresetCreate:
      type: object
      required:
      - name
      - config
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          description: A name that exists already gets a new version.
        config:
          $ref: '#/components/schemas/RunConfig'
        notes:
          type: string
    CloneRequest:
      type: object
      properties:
        seed:
          type:
          - integer
          - 'null'
          description: null = same seed (same config hash, new run id).
        name:
          type: string
        overrides:
          type: object
          description: 'Exploratory runs only: JSON-pointer -> value, for example {"/agents/0/policy/llm/temperature": 0.2}. Research fields that
            the condition sets are refused (research_field_locked).'
          additionalProperties: true
    ConfigDiffRow:
      type: object
      required:
      - path
      - values
      properties:
        path:
          type: string
          description: JSON pointer, for example /agents/0/policy/llm/model.
        values:
          type: object
          description: run id -> value (absent key = field not set).
          additionalProperties: true
    RunComparison:
      type: object
      required:
      - runs
      - config_diff
      - axis
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        config_diff:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDiffRow'
          description: Only fields that differ.
        axis:
          type: object
          properties:
            t_min:
              type: number
            t_max:
              type: number
          description: Shared time axis. Fetch each run's /series and /indicators to draw it.
    LlmJudge:
      type: object
      additionalProperties: false
      required:
      - provider_profile_id
      - model
      - model_family
      properties:
        provider_profile_id:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        model_family:
          type: string
          minLength: 1
          description: Must differ from every seller's model_family
    JevJudge:
      type: object
      additionalProperties: false
      required:
      - provider_profile_id
      - model
      properties:
        provider_profile_id:
          type: string
          minLength: 1
        model:
          type: string
          pattern: ^jev-\d+(\.\d+)*(-free)?$
          description: A fixed version (jev-1.13), never a latest alias
    JudgeBackends:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        llm:
          $ref: '#/components/schemas/LlmJudge'
        jev:
          $ref: '#/components/schemas/JevJudge'
        scripted:
          type: object
          additionalProperties: false
          description: The rule-based judge, for tests and the known answers; never a feature column
    EvaluationCreate:
      type: object
      additionalProperties: false
      description: Give run_ids or experiment_id (its parent runs), not both.
      required:
      - block
      - view
      - item_set_id
      - backends
      properties:
        run_ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
        experiment_id:
          type: string
        block:
          type: string
          enum:
          - wording
          - main
          - support_one_wording
          - talk_prices
          - stability
          - robustness
          - imported
        view:
          type: string
          enum:
          - talk_only
          - talk_prices
          - talk_thinking
        item_set_id:
          type: string
          minLength: 1
        backends:
          $ref: '#/components/schemas/JudgeBackends'
        order_seed:
          type: integer
          minimum: 0
          maximum: 4294967295
    LedgerRow:
      type: object
      required:
      - backend
      - used
      - retries_used
      - held
      - calls
      - cap
      - reserve
      properties:
        backend:
          type: string
          enum:
          - llm
          - jev
        used:
          type: integer
          description: Charged first calls. A retry counts in retries_used only
        retries_used:
          type: integer
          description: Charged retries, paid from the reserve only
        held:
          type: integer
        calls:
          type: integer
          description: This job's calls
        cap:
          type: integer
        reserve:
          type: integer
        block:
          type: string
        block_used:
          type: integer
        block_held:
          type: integer
        block_cap:
          type: integer
    EvaluationEstimate:
      type: object
      required:
      - episodes
      - excluded
      - skipped
      - order_seed
      - per_backend
      - warnings
      - assumptions
      properties:
        episodes:
          type: integer
        excluded:
          type: array
          items:
            type: object
            required:
            - run_id
            - index
            - reason
            properties:
              run_id:
                type: string
              index:
                type: integer
                description: Position in run_ids (or in the experiment's parents)
              reason:
                type: string
                enum:
                - not_found
                - not_completed
                - not_parent
                - split_not_in_block
                - condition_not_in_block
        skipped:
          type: array
          description: With experiment_id only. The experiment's parents whose condition is not in the block (DECISIONS-13 §7;
            CR-64 finding 1); they are not an error and not judged. With run_ids such a parent is refused (condition_not_in_block).
          items:
            type: object
            required:
            - run_id
            - reason
            properties:
              run_id:
                type: string
              reason:
                type: string
                enum:
                - condition_not_in_block
        order_seed:
          type:
          - integer
          - 'null'
          description: The order_seed sent; null when the server picks it at create
        per_backend:
          type: object
          additionalProperties:
            type: object
            required:
            - calls
            - tokens_in_est
            - ledger
            - within_cap
            properties:
              calls:
                type: integer
              tokens_in_est:
                type: integer
                description: Sum of the rendered inputs' tokens_est
              ledger:
                oneOf:
                - $ref: '#/components/schemas/LedgerRow'
                - type: 'null'
              within_cap:
                type: boolean
        warnings:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
    JudgeLedger:
      type: object
      required:
      - cap_per_backend
      - retry_reserve
      - chain
      - backends
      properties:
        cap_per_backend:
          type: integer
        retry_reserve:
          type: integer
        chain:
          type: object
          description: The hash chain of the judge call records, checked on each read. A broken chain refuses paid judge calls
          required:
          - ok
          - first_bad_line
          properties:
            ok:
              type: boolean
            first_bad_line:
              type:
              - integer
              - 'null'
        backends:
          type: object
          additionalProperties:
            type: object
            required:
            - used
            - retries_used
            - held
            - by_block
            properties:
              used:
                type: integer
                description: Charged first calls
              retries_used:
                type: integer
                description: Charged retries, from the reserve
              held:
                type: integer
                description: Planned calls with no record of queued or running jobs, and of failed jobs that own test cells (they resume under their id)
              by_block:
                type: object
                additionalProperties:
                  type: object
                  required:
                  - used
                  - held
                  - cap
                  - in_plan
                  properties:
                    used:
                      type: integer
                    held:
                      type: integer
                    cap:
                      type: integer
                      description: For a block with in_plan false, the cap of one job
                    in_plan:
                      type: boolean
    JudgeCall:
      type: object
      description: One call record (DECISIONS-9 §14). An llm request has a charged `sent` row first and an uncharged result row
        after it. A cache hit records latency 0, is not charged and is left out of latency stats.
      required:
      - backend
      - paraphrase
      - requested_at
      - finished_at
      - latency_ms
      - cache_hit
      - charged
      - input_tokens
      - output_tokens
      - status
      - model
      - returned_version
      - retry_of
      - error_reason
      - echo_removed
      - exploratory
      properties:
        backend:
          type: string
          enum:
          - llm
          - jev
          - scripted
        paraphrase:
          type: integer
        requested_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        latency_ms:
          type: integer
        cache_hit:
          type: boolean
        charged:
          type: boolean
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        status:
          type: string
          enum:
          - sent
          - ok
          - invalid
          - refused
          - no_talk
          - error
        model:
          type: string
        returned_version:
          type:
          - string
          - 'null'
        retry_of:
          type:
          - integer
          - 'null'
        error_reason:
          type:
          - string
          - 'null'
        echo_removed:
          type: integer
        exploratory:
          type: boolean
          description: true when the returned Jev version is not the item set's version after the freeze (CR-21 F8)
    LlmJudgement:
      type: object
      description: The aggregation of one LLM-shaped backend (llm or scripted) over its paraphrases (DECISIONS-9 §5). Arrays have
        one entry per paraphrase of the block; null for a call that is not ok.
      required:
      - status
      - n_ok
      - votes
      - agreement
      - agreement_share
      - split_vote
      - agreement_forced
      - talk_raw
      - talk_score
      - talk_range
      - quotes
      - commitments
      - rationale
      properties:
        status:
          type:
          - string
          - 'null'
        n_ok:
          type: integer
        votes:
          type: array
          items:
            type:
            - integer
            - 'null'
        agreement:
          type:
          - integer
          - 'null'
          description: Majority of the ok votes; null for a tie
        agreement_share:
          type:
          - number
          - 'null'
        split_vote:
          type: boolean
        agreement_forced:
          type: boolean
          description: An agreement 1 was set to 0 because no acceptance by the other seller follows a quoted offer
        talk_raw:
          type: array
          items:
            type:
            - integer
            - 'null'
        talk_score:
          type:
          - number
          - 'null'
          description: Mean of the ok scores, each divided by 5
        talk_range:
          type:
          - number
          - 'null'
        quotes:
          type: array
          items:
            type: object
            required:
            - role
            - round
            - sender
            - text
            - line
            properties:
              role:
                type: string
                enum:
                - offer
                - acceptance
              round:
                type: integer
              sender:
                type: string
              text:
                type: string
              line:
                type: integer
                description: The transcript line n that the quote check found
        commitments:
          type: array
          items:
            type: object
            required:
            - sender
            - round
            - promise
            properties:
              sender:
                type: string
              round:
                type: integer
              promise:
                type: string
        rationale:
          type: array
          items:
            type:
            - string
            - 'null'
    EpisodeJudgement:
      type: object
      description: The labels and split come from the run, never from the judge, and were never shown to it.
      required:
      - run_id
      - condition_id
      - group
      - labels
      - split
      - seed
      - input_hash
      - llm
      - jev
      - scripted
      - calls
      properties:
        run_id:
          type: string
        condition_id:
          type:
          - string
          - 'null'
        group:
          type:
          - string
          - 'null'
        labels:
          type:
          - object
          - 'null'
        split:
          type: string
        seed:
          type: integer
        input_hash:
          type:
          - string
          - 'null'
        llm:
          oneOf:
          - $ref: '#/components/schemas/LlmJudgement'
          - type: 'null'
        jev:
          type:
          - object
          - 'null'
          description: Jev is designed, not built; always null
        scripted:
          oneOf:
          - $ref: '#/components/schemas/LlmJudgement'
          - type: 'null'
        calls:
          type: array
          items:
            $ref: '#/components/schemas/JudgeCall'
    Evaluation:
      type: object
      description: GET /evaluations gives the fields up to error and skipped; GET /evaluations/{id} and POST add episodes, agreement
        and timing.
      required:
      - id
      - status
      - block
      - view
      - item_set
      - backends
      - order_seed
      - run_ids
      - created_at
      - started_at
      - finished_at
      - per_backend
      - error
      properties:
        id:
          type: string
          pattern: ^eval_[0-9A-Z]{26}$
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - stopped
          - failed
        block:
          type: string
        view:
          type: string
        item_set:
          type: object
          required:
          - id
          - hash
          properties:
            id:
              type: string
            hash:
              type: string
        backends:
          $ref: '#/components/schemas/JudgeBackends'
        order_seed:
          type: integer
        run_ids:
          type: array
          items:
            type: string
        skipped:
          type: array
          description: With experiment_id only. The experiment's parents whose condition is not in the block (DECISIONS-13 §7;
            CR-64 finding 1); they are not an error and not judged. With run_ids such a parent is refused (condition_not_in_block).
          items:
            type: object
            required:
            - run_id
            - reason
            properties:
              run_id:
                type: string
              reason:
                type: string
                enum:
                - condition_not_in_block
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        per_backend:
          type: object
          additionalProperties:
            type: object
            required:
            - calls_planned
            - calls_done
            - charged
            - tokens
            - wall_ms
            - counts
            - exploratory
            properties:
              calls_planned:
                type: integer
              calls_done:
                type: integer
              charged:
                type: integer
              tokens:
                type: integer
              wall_ms:
                type: integer
                description: Sum of call latencies, cache hits left out
              counts:
                type: object
                additionalProperties:
                  type: integer
              exploratory:
                type: integer
        error:
          type:
          - object
          - 'null'
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeJudgement'
        agreement:
          type:
          - object
          - 'null'
          description: Between llm and jev, over episodes both judged ok; null without both backends
          properties:
            n_both_ok:
              type: integer
            value:
              type:
              - number
              - 'null'
            rule:
              type: string
        timing:
          type: object
          additionalProperties:
            type: object
            required:
            - latency_ms
            - wall_ms
            - calls
            - tokens
            properties:
              latency_ms:
                type: object
                properties:
                  median:
                    type:
                    - number
                    - 'null'
                  p95:
                    type:
                    - number
                    - 'null'
              wall_ms:
                type: integer
              calls:
                type: integer
              tokens:
                type: integer
    IndicatorMarker:
      type: object
      required:
      - t
      - text
      properties:
        t:
          type: number
        text:
          type: string
        value:
          type:
          - number
          - 'null'
    IndicatorInstance:
      type: object
      required:
      - run_id
      - indicator_id
      - version
      - params
      - until
      - t
      - outputs
      description: One indicator with one set of params. Arrays are aligned with t; null where data is not enough (inside the first window).
      properties:
        run_id:
          type: string
        indicator_id:
          type: string
        version:
          type: string
        params:
          type: object
          additionalProperties: true
          description: The params used, defaults filled in.
        until:
          type: integer
        t:
          type: array
          items:
            type: number
        outputs:
          type: object
          description: 'Output name -> values (line, histogram). {seller} and {pair} are expanded: delta_p.A, corr.A_B.'
          additionalProperties:
            type: array
            items:
              type:
              - number
              - 'null'
        bands:
          type: object
          description: Output name -> upper and lower arrays (kind band).
          additionalProperties:
            type: object
            required:
            - upper
            - lower
            properties:
              upper:
                type: array
                items:
                  type:
                  - number
                  - 'null'
              lower:
                type: array
                items:
                  type:
                  - number
                  - 'null'
        markers:
          type: object
          description: Output name -> markers (kind marker).
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/IndicatorMarker'
    DemandRef:
      type: object
      required:
      - id
      - params
      description: A registered demand model and its params. GET /demand-models gives each model's params_schema.
      properties:
        id:
          type: string
          description: Registry id, for example linear.
        version:
          type: string
          description: Registry version. Omit for the latest; stored resolved.
        params:
          type: object
          additionalProperties: true
          description: 'Validated by the model''s params_schema and stored with defaults filled. Every model has c (common marginal cost) and
            c_offset ({seller: offset}; cost of s = c + c_offset[s]).'
    Shock:
      type: object
      required:
      - path
      - op
      - value
      properties:
        path:
          type: string
          pattern: ^(/[^/]+)+$
          description: 'JSON pointer into the demand params: /a, /c, /c_offset/A. A missing key inside a map counts as 0.'
        op:
          type: string
          enum:
          - add
          - mul
          - set
        value:
          type: number
    ScenarioProvenance:
      type:
      - object
      - 'null'
      additionalProperties: true
      description: Where the scenario came from. Generators write generator_id, generator_version, inputs, seed; the llm generator also profile_id,
        model, prompt_hash, raw_output_hash (never a key). A converted legacy file has converted_from_hash.
    DemandModel:
      type: object
      required:
      - id
      - version
      - name
      - formula
      - params_schema
      - references
      - research_allowed
      properties:
        id:
          type: string
        version:
          type: string
        name:
          type: string
        formula:
          type: string
        description:
          type: string
        params_schema:
          type: object
          additionalProperties: true
          description: JSON Schema of the params (build the form from it).
        labels:
          type: object
          additionalProperties:
            type: string
        references:
          type: array
          items:
            type: string
            enum:
            - nash
            - joint_optimum
            - best_response
        research_allowed:
          type: boolean
          description: true only when all three references exist. Layer-B indicators show 'not available' otherwise.
        solver_schema:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: JSON Schema of the target solver input (POST /demand-models/{model_id}/solve). null if none.
    DemandSolveResult:
      type: object
      required:
      - model_id
      - version
      - params
      - nash
      - joint_optimum
      - problems
      properties:
        model_id:
          type: string
        version:
          type: string
        params:
          type: object
          additionalProperties: true
        nash:
          type: number
        joint_optimum:
          type: number
        problems:
          type: array
          items:
            type: string
          description: The model's stability checks on the result. Empty = fine.
    ScenarioReference:
      type: object
      required:
      - scenario_id
      - demand_model
      - demand_version
      - references_available
      - rounds
      - markers
      properties:
        scenario_id:
          type: string
        hash:
          type:
          - string
          - 'null'
        demand_model:
          type: string
        demand_version:
          type: string
        references_available:
          type: boolean
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/ReferencePoint'
        markers:
          type: array
          items:
            type: object
            required:
            - t
            - kind
            - event_index
            properties:
              t:
                type: integer
              kind:
                type: string
                enum:
                - announce
                - effect
                - end
              event_index:
                type: integer
    ScenarioGenerator:
      type: object
      required:
      - id
      - version
      - name
      - input_schema
      - paid
      properties:
        id:
          type: string
          description: template, random, llm
        version:
          type: string
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
        paid:
          type: boolean
          description: 'true for llm: needs a provider profile, a budget and lead approval.'
        deterministic:
          type: boolean
          description: Same inputs and seed give the same draft.
    GenerateRequest:
      type: object
      required:
      - generator_id
      - inputs
      properties:
        generator_id:
          type: string
        inputs:
          type: object
          additionalProperties: true
        seed:
          type: integer
          default: 0
        provider_profile_id:
          type:
          - string
          - 'null'
          description: llm only.
        budget:
          $ref: '#/components/schemas/BudgetSettings'
    GenerateResult:
      type: object
      required:
      - draft
      - check
      description: Always a draft. Save it with POST /scenarios, then check, approve and freeze.
      properties:
        draft:
          $ref: '#/components/schemas/ScenarioDraft'
        check:
          $ref: '#/components/schemas/CheckReport'
        cost_usd:
          type: number
    ToolDefinition:
      type: object
      description: 'A tool as our request gave it to the model adapter (grant params applied), with a link back to the registry. On the wire the SDK sends the same names and properties, without the schema `title` keys and with `strict: true`.'
      required:
      - name
      - description
      - parameters
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema of the tool input.
        tool_id:
          type:
          - string
          - 'null'
        tool_version:
          type:
          - string
          - 'null'
    ScenarioRef:
