              enum:
              - A
              - B
            features:
              type: array
              items:
                $ref: '#/components/schemas/FeatureSpec'
            judge:
              type: object
              description: Only with evaluation_id. The source of the judge columns; only ok calls count, sent rows and exploratory
                calls are left out of the invalid rate
              required:
              - evaluations
              - view
              - transform
              - item_set
              - backend
              - model
              - model_family
              - wordings_by_group
              - invalid_rate_by_group
              properties:
                evaluations:
                  type: array
                  description: In request order
                  items:
                    type: object
                    required:
                    - evaluation_id
                    - status
                    - block
                    - episodes
                    properties:
                      evaluation_id:
                        type: string
                      status:
                        type: string
                      block:
                        type: string
                      episodes:
                        type: integer
                        description: Parent episodes the evaluation judges
                view:
                  type: string
                transform:
                  type: string
                item_set:
                  type: object
                  required:
                  - id
                  - hash
                  properties:
                    id:
                      type: string
                    hash:
                      type: string
                backend:
                  type: string
                  enum:
                  - llm
                model:
                  type: string
                model_family:
                  type: string
                wordings_by_group:
                  type: object
                  description: Per report group (C3 split into C3-accept and C3-silent), the distinct numbers of llm wordings
                    (paraphrases) an episode was judged with, for example C1 [3], C3-silent [1]
                  additionalProperties:
                    type: array
                    items:
                      type: integer
                invalid_rate_by_group:
                  type: object
                  additionalProperties:
                    type: number
        columns:
          type: array
          items:
            type: string
          description: experiment_id, condition_id, group, sub_condition, label_legal, label_harm, split, seed, parent_run_id, parent_status,
            child_run_ids (';'-joined), child_kinds (';'-joined probe, placebo or ablation, one per child run id in the same order,
            by kind name, then plan index; the empty string for a parent with no children), config_hash, condition_hash, seeds_hash, then `<id>` and `<id>_missing` per feature, with
            ablation_noop_rounds, ablation_noop_share and ablation_noop_share_all right after ablation_effect_missing (layer
            B; the shuffle ablation manipulation check, not features; the rounds from the fork in which any reader's
            observation records mask_noop, summed over the completed shuffle ablation children, the largest child share of
            such rounds, and the largest child share of rounds in which every reader's does; null without a completed shuffle
            child that recorded mask_noop, as in an episode before 0.23.0), then
            judge_evaluation_id and the judge columns with evaluation_id
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    FeatureSpec:
      type: object
      required:
      - id
      - version
      - name
      - description
      - evidence_type
      - data_layer
      - access
      - inputs
      - scenario
      - branches
      - code_hash
      properties:
        id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
        evidence_type:
          type: string
          enum:
          - conversation
          - coalition_advantage
          - dependence
          - quality
        data_layer:
          type: string
          enum:
          - A
          - B
        access:
          type: string
          enum:
          - log
          - model
          - intervention
          - trail
