  /runs/{run_id}/transcript:
    get:
      tags:
      - evaluations
      operationId: getRunTranscript
      summary: The blinded transcript of a parent run, as a judge backend gets it (DECISIONS-9 §3; CR-21 B1-B6).
      description: |-
        Tier A posts only, in the order of their delivery round (the round the other seller first read the post), then post time
        and seller order. lines[].round is that delivery round; the quote check uses it. Sellers are Seller 1, Seller 2 and channels
        channel 1, channel 2, in an order seeded by the run id and the same in both views; agent ids in the message text get the
        same names. Copies of 8 or more words from the run's own prompts are removed with no marker. talk_prices adds a table of
        posted prices per round. talk_thinking (DECISIONS-14 §3.2; legal path, secondary) adds each seller's thinking text per call
        of each used attempt (a rejected reply is not shown) from the run's trail.jsonl, with the same names, channel names and
        removal of 8-word prompt copies as the posts (counted in echo_removed), or one line saying that no thinking was returned.
        The response holds no condition, seed, seller id or channel id, except run_id, which is never in text or lines. 422
        validation_error (path run_id) for a branch child, a run with no episode yet, or talk_thinking with transform
        round_shuffle (its thinking lines show the true round order); 404 for an unknown run.
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: view
        in: query
        required: true
        schema:
          type: string
          enum:
          - talk_only
          - talk_prices
          - talk_thinking
      - name: transform
        in: query
        required: false
        schema:
          type: string
          enum:
          - none
          - round_shuffle
          default: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /judge/ledger:
    get:
      tags:
      - evaluations
      operationId: getJudgeLedger
      summary: The judge call ledger per backend and block (DECISIONS-9 §18), apart from agent budgets. used counts charged calls
        (real requests; not cache hits, no_talk or the scripted judge); held counts planned calls of open jobs.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeLedger'
  /evaluations/estimate:
    post:
      tags:
      - evaluations
      operationId: estimateEvaluation
      summary: The calls, tokens and ledger room of a judge job, with every check of POST /evaluations. Stores nothing.
      description: Episodes that the block cannot judge are listed under excluded (not_found, not_completed, not_parent,
        split_not_in_block, condition_not_in_block); POST /evaluations refuses them. A job that would pass a cap gives a warning here and 409 on POST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationEstimate'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /evaluations:
    get:
      tags:
      - evaluations
      operationId: listEvaluations
      summary: Judge jobs, newest first, without episodes.
      parameters:
      - name: run_id
        in: query
        schema:
          type: string
      - name: block
        in: query
        schema:
          type: string
          enum:
          - wording
          - main
          - support_one_wording
          - talk_prices
          - stability
          - robustness
          - imported
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - completed
          - stopped
          - failed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluation'
    post:
      tags:
      - evaluations
      operationId: createEvaluation
      summary: Start a judge job on completed parent runs (DECISIONS-9 §5-§8, §18). Poll GET /evaluations/{id} for progress.
      description: |-
        Checks, in this order: paid switch for llm and jev (409 paid_calls_disabled); episodes (422 validation_error, path
        run_ids/<i>, for a run that is unknown, not completed, a branch child or in a split the block does not judge); freeze gates
        (dev 409 condition_not_frozen, which also covers the rubric; test 409 test_split_locked); on dev or test, an llm backend
        with another profile, model, model_family, base_url or protocol than the judge of conditions/models.yaml (409
        model_not_frozen, path backends/llm/...); item set (422, path item_set_id);
        view in block (422, path view); judge family (422 judge_same_family); backend built (422 protocol_not_built for jev,
        which is designed, not built); the llm profile (404 not_found, 422 profile_key_missing or protocol_not_built); a test
        judgement already made (409 test_seed_already_run, the message names the evaluation); ledger room
        (409 evaluation_budget_exceeded). Calls run one at a time across backends, in an order seeded by order_seed (default from
        the evaluation id). A test call is locked when the job is stored. A restart resumes the job with no call made twice.
        Each llm request is recorded first as a charged `sent` row, then its result; a `sent` row with no result is a spent
        call that is not sent again. One retry on an invalid output, paid from the retry reserve. A job with paid calls does
        not start at server start while paid calls are off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCreate'
            example:
              run_ids:
              - run_01JB7X3K2M0000000000000000
              block: wording
              view: talk_only
              item_set_id: items-v1
              backends:
                scripted: {}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /evaluations/{evaluation_id}/resume:
    post:
      tags:
      - evaluations
      operationId: resumeEvaluation
      summary: Run a failed job again under the same id, like a crash resume. Calls with a record are kept and its test locks stay
        its own; no other job can take them.
      description: 404 for an unknown id; 409 conflict unless the job is failed; 409 paid_calls_disabled for llm or jev with paid
        calls off; 409 conflict for a broken ledger chain; 409 hash_mismatch when conditions/judge-rubric.yaml no longer has the
        item set hash of the plan.
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /evaluations/{evaluation_id}:
    get:
      tags:
      - evaluations
      operationId: getEvaluation
      summary: One judge job with every episode, the aggregation per backend, the call records, agreement between backends and timing.
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '404':
          $ref: '#/components/responses/Problem'
  /indicators:
    get:
      tags:
      - indicators
      operationId: listIndicators
      summary: The indicator registry. The UI builds the indicator menu and each parameter form from it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndicatorSpec'
              example:
              - id: delta_p
                version: '1'
                name: Δp (normalised price index)
                description: Price minus Nash, divided by joint optimum minus Nash, per seller and mean, per round.
                data_layer: B
                pane: separate
                inputs:
                - price.*
                - nash.*
                - joint_optimum.*
                params_schema:
                  type: object
                  properties:
                    smooth:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 1
                      title: Smoothing window (rounds)
                outputs:
                - name: delta_p.{seller}
                  kind: line
                  unit: ratio
                - name: delta_p
                  kind: line
                  unit: ratio
  /runs/{run_id}/indicators/{indicator_id}:
    get:
      tags:
      - indicators
      operationId: getRunIndicator
      summary: One indicator instance of one run, computed from its recorded events. A viewer may request the same indicator twice with different
        params.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: indicator_id
        in: path
        required: true
        schema:
          type: string
      - name: params
        in: query
        description: URL-encoded JSON object of params. Missing params use the defaults.
        schema:
          type: string
          examples:
          - '{"smooth":1}'
      - name: until
        in: query
        description: 'No-look-ahead cut: values at round t use rounds <= t only. Default: all recorded rounds.'
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorInstance'
              example:
                run_id: run_01JB7X3K2M
                indicator_id: delta_p
                version: '1'
                params:
                  smooth: 1
                until: 3
                t:
                - 1
                - 2
                - 3
                outputs:
                  delta_p.A:
                  - 0.0526
                  - 0.3684
                  - 0.6842
                  delta_p.B:
                  - 0.1579
                  - 0.3684
                  - 0.6842
                  delta_p:
                  - 0.1053
                  - 0.3684
                  - 0.6842
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
          description: indicator_params_invalid, with errors[].path per bad param.
  /runs/{run_id}/state:
    get:
      tags:
      - records
      operationId: getRunState
      summary: The state folded from the run's events at the end of round t (seek). Uses the snapshot of round t.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: t
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoldedState'
              example:
                run_id: run_01JB7X3K2M
                t: 2
                last_seq: 41
                snapshot_hash: sha256:3b9a…02
                reference:
                  t: 2
                  params:
                    a: 10
                    b: 1.5
                    d: 1.0
                    c: 1.0
                  nash: 5.75
                  joint_optimum: 10.5
                  nash_by_seller:
                    A: 5.75
                    B: 5.75
                  joint_by_seller:
                    A: 10.5
                    B: 10.5
                  nash_profit: 33.84
                  joint_profit: 45.13
                sellers:
                  A:
                    price: 7.5
                    quantity: 6.25
                    profit: 40.63
                    cumulative_profit: 78.13
                    set_by_system: false
                  B:
                    price: 7.5
                    quantity: 6.25
                    profit: 40.63
                    cumulative_profit: 75.0
                    set_by_system: false
                messages:
                - id: 0
                  t: 1
                  channel_id: private_A_B
                  sender: A
                  text: Hold 9?
                  deliver_t: 2
                masks: []
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /files/tree:
    get:
      tags:
      - files
      operationId: getFilesTree
      summary: The files the web file browser may read (DECISIONS-33, 0.43.0). Read-only, allowlisted folders under SIM_ROOT.
      description: 'The roots are paper/drafts, paper/analysis, paper/data, paper/review and conditions. Entries are flat, with paths
        relative to SIM_ROOT. Dot files, dot folders, __pycache__ and node_modules are left out, and so is any symlink that leaves its root.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesTree'
  /files/content:
    get:
      tags:
      - files
      operationId: getFileContent
      summary: One file of the allowlist (DECISIONS-33, 0.43.0). Text as text, png / jpg / svg as the image bytes, .html as text/plain.
      description: A path that is absolute, holds `..` or a segment that starts with `.`, leaves the roots through a symlink, or is outside
        the roots answers 404 not_found. A file over 20 MB answers 413 file_too_large. A file type that is not text or an image answers
        415 file_not_viewable.
      parameters:
      - name: path
        in: query
        required: true
        description: Path relative to SIM_ROOT, with slashes.
        schema:
          type: string
      responses:
        '200':
          description: The file
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /files/zip:
    get:
      tags:
      - files
      operationId: getFileZip
      summary: Members of a .zip of the allowlist, or one member as text (DECISIONS-33, 0.43.0).
      description: Without `member` the answer is the member list. With `member` the answer is that member as text/plain. A member over 20 MB
        uncompressed answers 413 file_too_large. The path rules are those of GET /files/content.
      parameters:
      - name: path
        in: query
        required: true
        description: Path of the .zip, relative to SIM_ROOT.
        schema:
          type: string
      - name: member
        in: query
        required: false
        description: Name of one member, as in the member list.
        schema:
          type: string
      responses:
        '200':
          description: The member list (JSON) or one member (text/plain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesZip'
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /ledger:
    get:
      tags:
      - ledger
      operationId: listLedger
      summary: Raw ledger lines (append-only, hash-chained).
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /ledger/verify:
    get:
      tags:
      - ledger
      operationId: verifyLedger
      summary: Check the hash chain.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - entries
                properties:
                  ok:
                    type: boolean
                  entries:
                    type: integer
                  first_bad_line:
                    type:
                    - integer
                    - 'null'
              example:
                ok: true
                entries: 42
                first_bad_line: null
  /demand-models:
    get:
      tags:
      - scenarios
      operationId: listDemandModels
      summary: Registered demand models with their params schema.
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemandModel'
  /demand-models/{model_id}/solve:
    post:
      tags:
      - scenarios
      operationId: solveDemand
      summary: 'Demand helper: target prices in, params out. Deterministic, no LLM.'
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Fits the model's solver_schema.
      responses:
        '200':
          description: Params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandSolveResult'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /scenario-generators:
    get:
      tags:
      - scenarios
      operationId: listScenarioGenerators
      summary: Registered scenario generators with their input schema.
      responses:
        '200':
          description: Generators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioGenerator'
  /scenarios/generate:
    post:
      tags:
      - scenarios
      operationId: generateScenario
      summary: Run a generator. Returns a draft and its check report; it saves nothing. llm costs calls and needs lead approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResult'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /scenarios/{scenario_id}/reference:
    get:
      tags:
      - scenarios
      operationId: getScenarioReference
      summary: params(t), costs, Nash(t) and joint optimum(t) per round, and event markers. For the preview chart.
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
      - name: until
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioReference'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^prof_[a-z0-9_]+$
    ScenarioId:
      name: scenario_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^scn_[A-Za-z0-9_]+$
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^run_[A-Z0-9]+$
  responses:
    Problem:
      description: Error (RFC 9457 problem details). Never contains a key or a raw provider error body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            frozen:
              value:
                type: about:blank
                title: Scenario is frozen
                status: 409
                code: scenario_frozen
                message: scn_cost_shock_v1 is frozen. Copy it to a new draft to change it.
                errors: []
            c3:
              value:
                type: about:blank
                title: Invalid run config
                status: 422
                code: condition_requires_talk_and_act
                message: Condition C3 needs call_mode talk_and_act.
                errors:
                - path: call_mode
                  message: must be talk_and_act for C3
  schemas:
    Health:
      type: object
      required:
      - status
      - api_version
      - simcore_version
      - schema_version
      - durable_backend
      - freeze
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        api_version:
          type: string
        simcore_version:
          type: string
        schema_version:
          type: string
          const: episode.v5
        durable_backend:
          type: string
          enum:
          - dbos
          - temporal
          - prefect
          - none
        paid_calls_enabled:
          type: boolean
          description: True when SIM_ALLOW_PAID=1 is set for the server, in the process environment or its .env (the environment wins). Read only.
        freeze:
          type: object
          properties:
            frozen:
              type: boolean
            frozen_at:
              type:
              - string
              - 'null'
              format: date-time
    FreezeStage:
      type: object
      required:
      - frozen
      - frozen_at
      - approved_by
      - valid
      - problems
      properties:
        frozen:
          type: boolean
        frozen_at:
          type:
          - string
          - 'null'
          format: date-time
        approved_by:
          type:
          - string
          - 'null'
        valid:
          type: boolean
        problems:
          type: array
          items:
            type: string
    FreezeStatus:
      type: object
      description: The top level is stage `rule`, the test gate. `stages.conditions` is the dev gate.
      required:
      - frozen
      - valid
      - stages
      properties:
        stages:
          type: object
          required:
          - conditions
          - rule
          properties:
            conditions:
              $ref: '#/components/schemas/FreezeStage'
            rule:
              $ref: '#/components/schemas/FreezeStage'
        frozen:
          type: boolean
        frozen_at:
          type:
          - string
          - 'null'
          format: date-time
        valid:
          type: boolean
          description: Stage rule is valid. A stage is valid when every hash it stores matches the files now, it covers every input
            of its stage, and every condition file is frozen with its own hash; stage rule also needs a valid stage conditions and both
            research files.
        problems:
          type: array
          items:
            type: string
        inputs:
          type: object
          description: GET only. Every freeze input with its hash now; null for a research file that is missing.
          additionalProperties:
            type:
            - string
            - 'null'
    BudgetStatus:
      type: object
      required:
      - cap_usd
      - spent_usd
      - calls
      - cache_hits
      properties:
        cap_usd:
          type: number
        spent_usd:
          type: number
        calls:
          type: integer
        cache_hits:
          type: integer
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - message
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - validation_error
          - not_found
          - conflict
          - scenario_frozen
          - scenario_not_frozen
          - scenario_check_failed
          - hash_mismatch
          - test_split_locked
          - test_seed_already_run
          - freeze_incomplete
          - condition_frozen
          - research_frozen
          - features_changed
          - condition_not_frozen
          - model_not_frozen
          - condition_invalid
          - seed_not_in_split
          - seeds_missing
          - seeds_invalid
          - split_not_allowed_for_kind
          - condition_requires_talk_and_act
          - capability_out_of_condition
          - profile_key_missing
          - profile_in_use
          - provider_unsupported
          - pricing_missing
          - budget_exceeded
          - budget_unenforceable
          - profile_read_only
          - protocol_not_built
          - run_not_active
          - snapshot_missing
          - unknown_tool
          - tool_not_allowed_for_role
          - invalid_grant_params
          - role_not_built
          - role_not_allowed_in_research
          - research_field_locked
          - judge_same_family
          - evaluation_budget_exceeded
          - episode_not_exported
          - preset_not_found
          - unknown_indicator
          - indicator_params_invalid
          - demand_not_research_allowed
          - solver_not_available
          - shock_path_invalid
          - unknown_generator
          - paid_calls_disabled
          - not_built
          - file_too_large
          - file_not_viewable
          - method_not_allowed
          - http_error
        message:
          type: string
          description: Short text for the user. Never a key, a request body or a provider error body.
        errors:
          type: array
          items:
            type: object
            required:
            - path
            - message
            properties:
              path:
                type: string
                description: 'Where in the request the problem is: keys and list indexes joined with `/`, with no leading `/`
                  (for example `call_mode`, `agents/0/role`, `branch_plan/probe/target`, `inputs/template`). A scenario check path is
                  a JSON Pointer into the demand params (`/a`). Empty = the whole request.'
              message:
                type: string
    ModelPricing:
      type: object
      required:
      - input_usd_per_mtok
      - output_usd_per_mtok
      description: Entered by the user. Optional on a profile (DECISIONS-8 §5); without it calls record cost_usd null.
      properties:
        input_usd_per_mtok:
          type: number
          minimum: 0
        output_usd_per_mtok:
          type: number
          minimum: 0
        cached_input_usd_per_mtok:
          type:
          - number
          - 'null'
          minimum: 0
          description: Price of cached input tokens. null prices them as input.
    ProviderSupports:
      type: object
      properties:
        tool_calls:
          type:
          - boolean
          - 'null'
        json_schema:
          type:
          - boolean
          - 'null'
        checked_at:
          type:
          - string
          - 'null'
          format: date-time
    ProviderProfile:
      type: object
      required:
      - base_url
      - created_at
      - id
      - key_env
      - key_hint
      - key_set
      - key_store
      - name
      - supports
      - supports_seed
      properties:
        id:
          type: string
          examples:
          - prof_openai_main
          - opencode_chat
        name:
          type: string
        base_url:
          type: string
          format: uri
        source:
          type: string
          enum:
          - store
          - env
          description: 'store: made on the Providers page (key in the keyring). env: read from SIM_PROFILE_<ID>_* in the server environment or
            .env at start (read-only; its id is the lower-case <ID>). A .env profile has no price, so max_usd never acts on its calls.'
        read_only:
          type: boolean
          description: true for source env. PATCH and DELETE give 409 profile_read_only; the test call is allowed (with the paid gate).
        protocol:
          type: string
          enum:
          - openai_chat
          - openai_responses
          - anthropic_messages
          - google
          - typesafe_systemone
          default: openai_chat
          description: 'Wire format (DECISIONS-9 §15). typesafe_systemone is registered but not built: binding it gives 422 protocol_not_built.'
        max_calls_per_5h:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Paid calls in any 5 hours, counted on this machine only (this data root). Other machines that share the key are not seen.
        session_header:
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z][A-Za-z0-9-]{0,63}$
          description: Header name for a stable conversation id, sent with every call (value <run_id>:<agent_id>; profile test
            profile-test:<id>). Never a secret, not part of the call-cache key. Not a key header and not User-Agent. Example
            x-opencode-session (OpenCode Go). Every call also sends User-Agent collusion-sim/<version>.
        key_set:
          type: boolean
        key_hint:
          type:
          - string
          - 'null'
          description: First 3 and last 4 characters, for example sk-…a1b2, for a key of 20 or more characters; only … for a shorter key. Never the key.
        key_store:
          type: string
          enum:
          - keyring
          - env
          description: 'keyring: OS keyring (service SIM_KEYRING_SERVICE, default collusion-sim; username = profile id). env: found only in the
            environment or .env.'
        default_model:
          type:
          - string
          - 'null'
        pricing:
          oneOf:
          - $ref: '#/components/schemas/ModelPricing'
          - type: 'null'
        model_pricing:
          type: object
          description: Optional per-model prices that override `pricing`.
          additionalProperties:
            $ref: '#/components/schemas/ModelPricing'
        supports:
          $ref: '#/components/schemas/ProviderSupports'
        supports_seed:
          type: boolean
          default: false
          description: The endpoint honours the OpenAI `seed` parameter. When true, each call sends a seed derived from the run seed, seller,
            round, sample index and attempt.
        max_concurrency:
          type: integer
          minimum: 1
          default: 2
        created_at:
          type: string
          format: date-time
        key_env:
          type: string
          description: 'Env var of this profile''s key. Store profile: SIM_KEY_<PROFILE_ID> (upper case, non-alphanumerics as _), from the server
            environment or <SIM_ROOT>/.env; a store profile with a key in the keyring and in this variable stops the server at start. .env profile:
            SIM_PROFILE_<ID>_KEY only.'
        rate_window:
          type:
          - object
          - 'null'
          description: Only with max_calls_per_5h. Counted from the stored llm_call events of this data root.
          properties:
            max_calls_per_5h:
              type: integer
            used:
              type: integer
            room:
              type: integer
            rate_limited:
              type: integer
              description: Calls that got a 429 in the last 5 hours.
