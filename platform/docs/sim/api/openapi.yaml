          agent_id:
            type: string
          text:
            type: string
      examples:
      - seq: 21
        run_id: run_01JB7X3K2M
        type: talk_text
        t: 6
        wall_time: '2026-10-23T09:01:13Z'
        tier: B
        agent_id: A
        text: PASS
    ActedEvent:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - type
        - agent_id
        - price
        - hold
        - fallback
        - forced
        properties:
          type:
            const: acted
          agent_id:
            type: string
          price:
            type: number
            description: Effective price (on the grid).
          hold:
            type: boolean
          fallback:
            type: boolean
            description: true = no valid action after the attempts, last price kept.
          fallback_reason:
            type:
            - string
            - 'null'
            enum:
            - timeout
            - error
            - invalid
            - max_steps
            - null
            description: Why the system held (DECISIONS-22 entry 5.4). timeout = two slow attempts (call_timeout or stream_stalled);
              error = provider errors on every attempt; invalid = no valid tool call; max_steps = the steps ran out. Null when
              fallback is false.
          forced:
            type: boolean
            description: true = the host set this price (probe).
          asked_price:
            type:
            - number
            - 'null'
            description: The price the seller asked with set_price when the grid snap changed it (off the grid or past a bound);
              price is the snapped value. Null when the asked price was on the grid, and in episodes written before 0.41.0. A null
              asked_price is left out of the episode hash (DECISIONS-30 §3.3).
          steps:
            type:
            - integer
            - 'null'
            description: Model calls of this seller this round (talk and act phases). null for scripted and forced sellers.
          tool_calls:
            type:
            - integer
            - 'null'
          messages:
            type:
            - integer
            - 'null'
            description: Posts accepted this round.
          limits_hit:
            type: array
            description: Limits this seller reached this round (a manipulation-check flag for the feature table).
            items:
              type: string
              enum:
              - max_steps_per_turn
              - max_messages_per_round
              - post.max_per_round
              - max_queries_per_round
              - capability.max_queries_per_round
      examples:
      - seq: 25
        run_id: run_01JB7X3K2M
        type: acted
        t: 6
        wall_time: '2026-10-23T09:01:14Z'
        tier: A
        agent_id: A
        price: 9.5
        hold: false
        plan: Match B, wait for a reply.
        fallback: false
        forced: false
