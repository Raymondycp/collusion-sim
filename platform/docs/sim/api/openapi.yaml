        when it is spent (runs end with budget_exceeded).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreate'
            examples:
              pilot:
                $ref: '#/components/examples/ExperimentPilot'
      responses:
        '202':
          description: Accepted. The parents are queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
