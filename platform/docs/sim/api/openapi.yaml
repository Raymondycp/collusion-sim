      - chars
      - tokens_est
      - lines
      - text
      properties:
        run_id:
          type: string
        view:
          type: string
          enum:
          - talk_only
          - talk_prices
          - talk_thinking
        view_version:
          type: string
        transform:
          type: string
          enum:
          - none
          - round_shuffle
        input_hash:
