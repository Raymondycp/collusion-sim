      summary: Start an experiment (DECISIONS-10 §3). conditions × seeds cells; each cell is one parent run plus the branch plan's children,
        which start automatically after the parent completed.
      description: Every run id (parents and planned children) is recorded before any run starts, so a restart resumes the experiment and
        never runs a cell twice. At most 4 runs execute at a time (the run queue). All checks of a research run apply per condition
        (409 test_split_locked, 409 condition_not_frozen, 409 hash_mismatch, 409 model_not_frozen, 422 seed_not_in_split, 422
