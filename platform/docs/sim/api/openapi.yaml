        tokens_est:
          type: integer
          description: chars / 4, rounded up
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptLine'
        text:
          type: string
          description: The exact bytes a backend gets
    StoredFile:
      type: object
      required:
      - name
      - text
      - hash
      - updated_at
      properties:
        name:
          type: string
          description: Path from the repo root, for example conditions/C1.yaml
        text:
          type:
          - string
          - 'null'
        hash:
