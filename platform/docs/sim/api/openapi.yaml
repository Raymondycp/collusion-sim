  /runs/{run_id}/export:
    get:
      tags:
      - records
      operationId: exportRun
      summary: Export the run. `zip` holds the exact files (episode.jsonl, meta.json, trail.jsonl, manifest.json, and with include=branches every branch child).
      description: >-
        trail.jsonl (DECISIONS-14 §2.2) is a sidecar, one JSON line per llm_call in seq order. The run writes it
        to runs/<run_id>/trail.jsonl when it finishes, and the export serves that file; for an older run without
        one the export builds it from the call cache. A line has the event's fields (seq, t, agent_id, purpose,
        attempt, charged, model, tokens, cost, error), `paid_by_run` (the run that paid for a cached reply, so a
        hit from another run shows it), and what was sent: `allow_text`, `settings`, `tools` (as Pydantic AI
        ToolDefinition) and `messages` (the request messages and the reply as Pydantic AI 2.58 ModelMessages,
        for ModelMessagesTypeAdapter; every timestamp is the event's wall_time). `missing` is null, `reply` (a
        failed call: the request is kept, there is no reply) or `no_cache_row` (the cache has neither; then
        `messages`, `tools`, `allow_text` and `settings` are null). `finish_reason` is the provider's (null with
        no reply or in an older cache row). Token counts in `messages` are 0 when unknown; the line's own token
        fields are null then. `thinking` is the text of the thinking or reasoning parts that the provider
        returned (also a ThinkingPart in `messages`), null when there is none, never empty; `thinking_parts`
        counts those parts (0 when none, null in an older cache row). Nothing in the request asks a model for
        them. The trail is not part of episode.jsonl and not in the episode hash. A trail holds the full
        prompts, so it shows the condition: it is for the team's analysis, not for blinded sets. manifest.json,
        written last, lists every file with its bytes and sha256. With include=branches each child is under
        branches/<child_id>/. A run of the test split gives 409 test_split_locked without a valid freeze, as the
        experiment and feature exports. The zip is built in a temporary file, not in memory.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - zip
          - sandbox_json
          - csv_rounds
      - name: include
        in: query
        description: zip only. `branches` adds branches/<child_id>/ (episode.jsonl, meta.json, trail.jsonl) for every branch child.
        schema:
          type: string
          enum:
          - branches
      responses:
        '200':
          description: File
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/csv:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
