              max_calls_per_5h:
                type: integer
              used:
                type: integer
              room:
                type: integer
              rate_limited:
                type: integer
              calls_max:
                type: integer
              enough:
                type: boolean
        warnings:
          type: array
          items:
            type: string
          description: For example a 5-hour window that is too small for the worst case, or a budget the server will refuse.
        assumptions:
          type: array
          items:
            type: string
    RunStartResponse:
      type: object
      required:
      - batch_id
      - run_ids
      properties:
        batch_id:
          type: string
          pattern: ^batch_[0-9A-HJKMNP-TV-Z]{26}$
        run_ids:
          type: array
          items:
            type: string
        estimate_usd_max:
          type:
          - number
          - 'null'
          description: 'Upper cost bound of the batch: budget.max_usd times the number of runs. 0 when no agent is an LLM. null is reserved for DECISIONS-8 section 5 (no USD cap).'
    BranchInfo:
      type: object
      required:
