    ProfileTestResult:
      type: object
      required:
      - ok
      - model
      properties:
        ok:
          type: boolean
        model:
          type: string
        latency_ms:
          type:
          - integer
          - 'null'
        supports:
          $ref: '#/components/schemas/ProviderSupports'
        error:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - kind
            - message
            properties:
              kind:
                type: string
                enum:
                - auth
                - not_found
                - rate_limit
                - timeout
                - network
                - unsupported
                - other
              http_status:
                type:
                - integer
                - 'null'
              message:
                type: string
                description: Our summary of the failure. Never the request body; the provider's error message is in provider_message.
              provider_code:
                type:
                - string
                - 'null'
                description: The provider's error code or type from the error body, else the exception class name.
              provider_message:
                type:
                - string
                - 'null'
                description: The message of the provider's error body with the stored key, its hint and key-shaped strings masked, at most 160 characters. Model ids stay.
    PriceGrid:
      type: object
      required:
      - min
      - max
      - step
      properties:
        min:
          type: number
          default: 0
        max:
          type: number
          default: 15
        step:
          type: number
          default: 0.05
          exclusiveMinimum: 0
    MarketSpec:
      type: object
      required:
      - demand
      properties:
        demand:
          $ref: '#/components/schemas/DemandRef'
        grid:
          $ref: '#/components/schemas/PriceGrid'
          description: 'Optional on input: the default grid is 0 to 15, step 0.05. Responses always carry it.'
    ScenarioEvent:
      type: object
      required:
      - announce
      - visible
      description: 'Shocks fold over the base params in event order while effect <= t < effect + length. kind and news are optional on input (news defaults to empty); responses always carry both.'
      properties:
        kind:
          type: string
          enum:
          - news_only
          - param_shock
          description: 'Optional on input: param_shock when shocks are given, else news_only. news_only has no shocks, effect or length; param_shock needs all three.'
        announce:
          type: integer
          minimum: 1
          description: Round when the listed sellers see the news.
        effect:
          type:
          - integer
          - 'null'
          description: First round of the shocks. null for news_only.
        length:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Rounds the shocks last. 9999 for permanent. null for news_only.
        shocks:
          type: array
          items:
            $ref: '#/components/schemas/Shock'
          default: []
        visible:
          type: array
          items:
            type: string
          description: Seller ids who see the news. Empty = nobody.
        news:
          type: string
          description: Text that View shows.
        news_source:
          type: string
          enum:
          - human
          - ai
          default: human
        misleading:
          type: boolean
          default: false
          description: The news direction disagrees with the shocks on purpose (the news_direction check then passes).
    ScenarioHorizon:
      type: object
      required:
      - min_rounds
      - max_rounds
      - stop_prob
      description: Agents never see the horizon. The stop round comes from the seed.
      properties:
        min_rounds:
          type: integer
          default: 30
        max_rounds:
          type: integer
          default: 40
        stop_prob:
          type: number
          minimum: 0
          maximum: 1
          default: 0.1
          description: Per-round stop chance after min_rounds.
    ScenarioDraft:
      type: object
      required:
      - name
      - market
      - n_sellers
      - horizon
      - events
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
        market:
          $ref: '#/components/schemas/MarketSpec'
        n_sellers:
          type: integer
          minimum: 2
          maximum: 6
          default: 2
        seller_ids:
          type: array
          items:
            type: string
          description: Defaults to A, B, C, …
        horizon:
          $ref: '#/components/schemas/ScenarioHorizon'
        quiet_window:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          default:
          - 18
          - 25
        events:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioEvent'
        provenance:
          $ref: '#/components/schemas/ScenarioProvenance'
    ScenarioStatus:
      type: string
      enum:
      - draft
      - frozen
    Scenario:
      allOf:
      - $ref: '#/components/schemas/ScenarioDraft'
      - type: object
        required:
        - id
        - status
        - hash
        - version
        - created_at
        - updated_at
        properties:
          id:
            type: string
          status:
            $ref: '#/components/schemas/ScenarioStatus'
          hash:
            type:
            - string
            - 'null'
            description: sha256 of the canonical JSON. null for drafts.
          version:
            type: integer
            minimum: 1
            description: Draft edit counter. 1 after POST, plus 1 on every accepted PUT (also when the body did not change). Freeze
              keeps no counter, so a frozen scenario reports 1; identify a frozen scenario by `hash`.
          approved_by:
            type:
            - string
            - 'null'
          frozen_at:
            type:
            - string
            - 'null'
            format: date-time
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    ScenarioSummary:
      type: object
      required:
      - id
      - name
      - status
      - hash
      - n_sellers
      - n_events
      - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ScenarioStatus'
        hash:
          type:
          - string
          - 'null'
        n_sellers:
          type: integer
        n_events:
          type: integer
        updated_at:
          type: string
          format: date-time
    CheckReport:
      type: object
      required:
      - ok
      - checks
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required:
            - id
            - ok
            - message
            properties:
              id:
                type: string
                enum:
                - shock_paths
                - stability
                - quiet_window
                - news_direction
                - visible_ids
                - horizon
              ok:
                type: boolean
              message:
                type: string
              event_index:
                type:
                - integer
                - 'null'
    MarketPreview:
      type: object
      required:
      - rounds
      - checks
      properties:
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/ReferencePoint'
        checks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ok:
                type: boolean
              message:
                type: string
    ReferencePoint:
      type: object
      required:
      - t
      - params
      - costs
      properties:
        t:
          type: integer
        params:
          type: object
          additionalProperties: true
          description: The demand params in force this round (shape from the demand model).
        costs:
          type: object
          additionalProperties:
            type: number
          description: Marginal cost of each seller this round.
        nash:
          type: number
          description: Mean over sellers of nash_by_seller. Absent when the model has no closed forms.
        joint_optimum:
          type: number
        nash_by_seller:
          type: object
          additionalProperties:
            type: number
        joint_by_seller:
          type: object
          additionalProperties:
            type: number
        nash_profit:
          type: number
        joint_profit:
          type: number
    AiAssistRequest:
      type: object
      required:
      - provider_profile_id
      - model
      properties:
        provider_profile_id:
          type: string
        model:
          type: string
        temperature:
          type: number
          default: 0
        event_indices:
          type:
          - array
          - 'null'
          items:
            type: integer
          description: null = all events.
        style:
          type: string
    Labels:
      type: object
      required:
      - legal
      - harm
      description: Computed from the condition config only.
      properties:
        legal:
          type: string
          enum:
          - 'yes'
          - 'no'
          - undetermined
        harm:
          type: string
          enum:
          - 'yes'
          - 'no'
    Condition:
      type: object
      description: A condition file (conditions/<id>.yaml) with its prompt paths resolved to texts (DECISIONS-10 §1). Read-only. A research
        run takes all of these fields from it.
      required:
      - id
      - version
      - status
      - group
      - name
      - tag
      - description
      - hash
      - labels
      - market_preset
      - channels
      - call_mode
      - c3_isolation
      - transparency
      - memory_summary
      - observation_mode
      - limits
      - capabilities
      - prompt_variants
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,31}$
          examples:
          - C1
          - C2a
          - C2b
          - C3-accept
          - C3-silent
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - draft
          - frozen
          description: Pilot seeds run on a draft. Dev seeds need status frozen (set by the lead in the pre-registration commit).
        frozen_hash:
          type:
          - string
          - 'null'
          description: The condition hash recorded when the lead froze it; set if and only if status is frozen. A run on a condition whose
            hash no longer equals frozen_hash gives 409 hash_mismatch.
        group:
          type: string
          enum:
          - C1
          - C2a
          - C2b
          - C3
          - C4
          - LC
        sub_condition:
          type:
          - string
          - 'null'
          enum:
          - responder_accepts
          - responder_silent
          - null
          description: C3 only.
        name:
          type: string
        tag:
          type: string
          enum:
          - required
          - support
          - extension
        description:
          type: string
          description: For people. Never sent to an agent.
        hash:
          type: string
          description: sha256 of the condition with its resolved prompt texts, without `status` and `frozen_hash`.
        labels:
          $ref: '#/components/schemas/Labels'
        market_preset:
          type: string
          enum:
          - base
          - elastic
        channels:
          $ref: '#/components/schemas/ChannelSettings'
        call_mode:
          $ref: '#/components/schemas/CallMode'
        c3_isolation:
          type: boolean
          description: true = the act call never sees channel content.
        transparency:
          type: string
          enum:
          - rival_last_round
          - opaque
          description: rival_last_round = every seller has the get_rival_prices grant.
        same_model_for_all_sellers:
          type:
          - boolean
          - 'null'
          description: 'C2a true (one model), C2b false (a different model_family per seller), others null (free). Scripted sellers count by
            policy kind.'
        memory_summary:
          type: string
          enum:
          - code
          - llm
          - none
        observation_mode:
          type: string
          enum:
          - push
          - pull
          - both
          description: Stated by every condition file (DECISIONS-15 §3.2); see RunConfig.observation_mode. pull needs
            max_queries_per_round above 0, and push (or no queries) needs the grants that the push follows.
        limits:
          $ref: '#/components/schemas/RunLimits'
        capabilities:
          type: object
          description: Seller id -> capability (tool grants). Research runs use these exactly.
          additionalProperties:
            $ref: '#/components/schemas/Capability'
        prompt_variants:
          type: array
          description: Two paraphrases (v1, v2). A run on seed s uses variant index s % 2. No text names a group, a label or the study.
          items:
            type: object
            required:
            - id
            - sellers
            properties:
              id:
                type: string
                enum:
                - v1
                - v2
              sellers:
                type: object
                description: Seller id -> prompts.
                additionalProperties:
                  type: object
                  required:
                  - system_prompt
                  properties:
                    system_prompt:
                      type: string
                      description: Pricing (act or one_call) system prompt.
                    talk_prompt:
                      type:
                      - string
                      - 'null'
                      description: Talk call system prompt; null when the seller cannot post.
    Split:
      type: string
      enum:
      - pilot
      - dev
      - test
      - exploratory
    SeedSplits:
      type: object
      required:
      - hash
      - pilot
      - dev
      - test
      - test_locked
      properties:
        hash:
          type: string
        pilot:
          type: array
          items:
            type: integer
        dev:
          type: array
          items:
            type: integer
        test:
          type: array
          items:
            type: integer
        test_locked:
          type: boolean
        seeds:
          type: array
          description: Every seed of the map with its design factor and its frozen scenario (from conditions/seeds.yaml).
          items:
            type: object
            additionalProperties: false
            required:
            - seed
            - split
            - shock_news
            - informed_seller
            - scenario_id
            - scenario_hash
            properties:
              seed:
                type: integer
              split:
                type: string
                enum:
                - pilot
                - dev
                - test
              shock_news:
                type: string
                enum:
                - public
                - private
                description: 'Who is told about each shock: public = every seller; private = informed_seller only.'
              informed_seller:
                type:
                - string
                - 'null'
                description: The one informed seller of a private seed (alternating A, B over the private seeds of a split); null
                  when public.
              scenario_id:
                type: string
              scenario_hash:
                type: string
    ExperimentId:
      type: string
      pattern: ^exp_[0-9A-HJKMNP-TV-Z]{26}$
    ProbePlan:
      type: object
      additionalProperties: false
      properties:
        at:
          type: integer
          minimum: 2
          default: 20
        rounds:
          type: integer
          minimum: 1
          default: 5
        target:
          type: string
          default: B
          description: A seller id
    PlaceboPlan:
      type: object
      additionalProperties: false
      properties:
        at:
          type: integer
          minimum: 2
          default: 20
        rounds:
          type: integer
          minimum: 1
          default: 5
        n:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
    AblationPlan:
      type: object
      additionalProperties: false
      description: One child per private channel, from `at` to the parent's last round, for conditions whose group is in `groups`. A
        condition with no private channel gets one null ablation child (`ablated` none), so every group has the ablation feature.
      properties:
        at:
          type: integer
          minimum: 2
          default: 10
        mode:
          type: string
          enum:
          - clear
          - shuffle
          default: shuffle
        groups:
          type: array
          items:
            type: string
          default:
          - C1
          - C2a
          - C2b
          - C3
          - C4
          - LC
    BranchPlan:
      type: object
      additionalProperties: false
      description: 'Plan §11 defaults: probe at round 20 (1 probe + 3 placebo children, 5 rounds each), ablation from round 10 for C1 and
        C3. null turns a part off. 422 validation_error if a child would pass a seed''s last round.'
      properties:
        probe:
          oneOf:
          - $ref: '#/components/schemas/ProbePlan'
          - type: 'null'
        placebo:
          oneOf:
          - $ref: '#/components/schemas/PlaceboPlan'
          - type: 'null'
        ablation:
          oneOf:
          - $ref: '#/components/schemas/AblationPlan'
          - type: 'null'
    BatchBudget:
      type: object
      additionalProperties: false
      description: Shared by every run of a batch (all seeds of one POST /runs, or all runs of an experiment; at least one limit set). Counts
        paid calls only (not cache hits).
      minProperties: 1
      properties:
        max_usd:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
        max_calls:
          type:
          - integer
          - 'null'
          minimum: 1
        max_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Input + output tokens (cached input and reasoning included) of all runs together.
    ExperimentCreate:
      type: object
      additionalProperties: false
      required:
      - conditions
      - split
      - seeds
      - agents
      - budget
      - batch_budget
      properties:
        name:
          type:
          - string
          - 'null'
          maxLength: 120
        conditions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        split:
          type: string
          enum:
          - pilot
          - dev
          - test
        seeds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
        agents:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/AgentConfig'
          description: As in a research RunConfig (no capability, no prompts).
        agents_by_condition:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AgentConfig'
          description: Agents for one condition instead of `agents` (C2b needs a different model family per seller).
        clock:
          $ref: '#/components/schemas/ClockSettings'
        memory:
          $ref: '#/components/schemas/MemorySettings'
        budget:
          $ref: '#/components/schemas/BudgetSettings'
        batch_budget:
          $ref: '#/components/schemas/BatchBudget'
        branch_plan:
          $ref: '#/components/schemas/BranchPlan'
        opening_price:
          type:
          - number
          - 'null'
          minimum: 0
          description: RunConfig.opening_price for every run of the experiment (0.42.0). Left out of the request hash when null.
        replicate:
          type: integer
          minimum: 0
          default: 0
          description: RunConfig.replicate for every run of the experiment (0.45.0). Left out of the request hash when 0.
    ExperimentEstimate:
      type: object
      required:
      - n_cells
      - runs
      - calls_max
      - tokens_max
      - usd_max
      - pricing_missing_for
      - per_condition
      - within_budget
      - assumptions
      properties:
        n_cells:
          type: integer
        runs:
          type: object
          required:
          - parents
          - probe
          - placebo
          - ablation
          - total
          properties:
            parents:
              type: integer
            probe:
              type: integer
            placebo:
              type: integer
            ablation:
              type: integer
            total:
              type: integer
        calls_max:
          type: integer
        tokens_max:
          type: object
          required:
          - input
          - output
          properties:
            input:
              type: integer
            output:
              type: integer
        usd_max:
          type:
          - number
          - 'null'
        pricing_missing_for:
          type: array
          items:
            type: string
          description: Provider profile ids without a price
        per_condition:
          type: array
          items:
            type: object
            required:
            - condition_id
            - runs
            - calls_max
            - input_tokens_max
            - output_tokens_max
            - usd_max
            properties:
              condition_id:
                type: string
              runs:
                type: integer
              calls_max:
                type: integer
              input_tokens_max:
                type: integer
              output_tokens_max:
                type: integer
              usd_max:
                type:
                - number
                - 'null'
        within_budget:
          type:
          - boolean
          - 'null'
        rate_window:
          type: array
          description: As in CostEstimate, for all runs of the experiment together.
          items:
            type: object
        warnings:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
    ExperimentRunState:
      type: object
      required:
      - run_id
      - status
      - end_reason
      properties:
        run_id:
          type: string
          pattern: ^run_[0-9A-HJKMNP-TV-Z]{26}$
        status:
          type: string
          description: A RunStatus, or planned (recorded, not stored yet)
          enum:
          - planned
          - queued
          - running
          - paused
          - stopping
          - completed
          - stopped
          - failed
          - recovering
        end_reason:
          type:
          - string
          - 'null'
    ExperimentCell:
      type: object
      required:
      - condition_id
      - seed
      - status
      - error
      - parent
      - branches
      properties:
        condition_id:
          type: string
        seed:
          type: integer
        status:
          type: string
          description: The parent's status until it completed; then branching until every child ended; then completed, or failed / stopped
            if a child did. blocked = the server could not start the cell's next run (see error); it tries again after every
            finished run, at each server start and on POST /experiments/{experiment_id}/retry.
          enum:
          - blocked
          - planned
          - queued
          - running
          - paused
          - stopping
          - recovering
          - branching
          - completed
          - stopped
          - failed
        error:
          oneOf:
          - type: object
            required:
            - code
            - message
            - at
            properties:
              code:
                type: string
                description: A Problem code, for example paid_calls_disabled or hash_mismatch
              message:
                type: string
              at:
                type: string
          - type: 'null'
        parent:
          $ref: '#/components/schemas/ExperimentRunState'
        branches:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/ExperimentRunState'
            - type: object
              required:
              - kind
              - index
              properties:
                kind:
                  type: string
                  enum:
                  - probe
                  - placebo
                  - ablation
                index:
                  type: integer
                  description: 10 × position in the plan + sample index
    ArchiveRequest:
      type: object
      additionalProperties: false
      description: Exactly one of ids and all (DECISIONS-29, 0.39.0).
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
        all:
          const: true
      oneOf:
      - required:
        - ids
      - required:
        - all
    ArchiveResult:
      type: object
      required:
      - count
      - skipped
      properties:
        count:
          type: integer
          description: Records changed.
        skipped:
          type: array
          items:
            type: string
          description: Running runs or experiments that all left out (D29 entry 2). Empty otherwise.
    ExperimentSummary:
      type: object
      required:
      - id
      - name
      - hash
      - created_at
      - status
      - split
      - conditions
      - seeds
      - counts
      - spend
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the record was archived (DECISIONS-29), null when it is not. Archived records leave the list unless
            include_archived=true (0.39.0).
        id:
          $ref: '#/components/schemas/ExperimentId'
        name:
          type:
          - string
          - 'null'
        hash:
          type: string
          description: sha256 of the request without its name
        created_at:
          type: string
        status:
          type: string
          enum:
          - running
          - completed
          - ended
          - blocked
          description: ended = every cell ended and at least one did not complete. blocked = no cell is live and at least one
            cell is blocked (see its error).
        split:
          type: string
        conditions:
          type: array
          items:
            type: string
        seeds:
          type: array
          items:
            type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Cells per cell status
        spend:
          type: object
          required:
          - calls
          - usd
          - tokens
          - unpriced
          - usd_complete
          properties:
            calls:
              type: integer
            usd:
              type: number
              description: Priced calls only.
            tokens:
              type: integer
            unpriced:
              type: integer
              description: Paid calls with cost_usd null (no price).
            usd_complete:
              type: boolean
              description: false when some paid calls have no price, so usd is a lower bound.
    Experiment:
      allOf:
      - $ref: '#/components/schemas/ExperimentSummary'
      - type: object
        required:
        - branch_plan
        - batch_budget
        - estimate
        - cells
        properties:
          branch_plan:
            $ref: '#/components/schemas/BranchPlan'
          batch_budget:
            $ref: '#/components/schemas/BatchBudget'
          estimate:
            $ref: '#/components/schemas/ExperimentEstimate'
          cells:
            type: array
            items:
              $ref: '#/components/schemas/ExperimentCell'
    Capability:
      type: object
      required:
      - grants
      description: A set of tool grants. Each grant must be allowed for the agent's role (GET /roles, GET /tools). The code enforces it; a tool
        that is not granted is not offered to the model.
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/ToolGrant'
        max_queries_per_round:
          type: integer
          minimum: 0
          maximum: 3
          default: 3
          description: Read-tool calls per agent per round, over all calls of that round.
    PolicyType:
      type: object
      required:
      - kind
      - name
      - roles
      - params
      properties:
        kind:
          $ref: '#/components/schemas/PolicyKind'
        name:
          type: string
        params:
          type: array
          items:
            type: object
            required:
            - name
            - type
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                - number
                - integer
                - string
                - boolean
                - object
                - array
              schema:
                type: object
                description: JSON Schema of the param (for example price_schedule.prices is an object from round to price).
              default: {}
        roles:
          type: array
          items:
            type: string
    PolicyKind:
      type: string
      description: imported is the sellers' kind in a run of POST /imports; POST /runs refuses it (422 validation_error).
      enum:
      - llm
      - constant
      - price_schedule
      - best_response
      - grim_trigger
      - tit_for_tat
      - scripted_talker
      - scripted_host
      - imported
    LlmSettings:
      type: object
      required:
      - provider_profile_id
      - model
      properties:
        provider_profile_id:
          type: string
          minLength: 1
          description: Reference only. The key stays server side.
        model:
          type: string
          minLength: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        top_p:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 1
          description: Sent to the model when set.
        max_output_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
          default: null
          description: Per agent. Sent as max_tokens, and used for this agent's worst-case cost before each call. null = no limit, not sent
            (the provider's maximum; DECISIONS-18 entry 2); the budget and the estimate then count 32,000 output tokens per call.
        timeout_s:
          type: number
          exclusiveMinimum: 0
          maximum: 600
          default: 60
          description: The deadline of the whole call, in seconds, on a wall clock from the request start (DECISIONS-18 entry 2, DECISIONS-21; the pilot model uses 300). Apart from it, a stream with no data for 60 s fails (a constant).
        thinking:
          oneOf:
          - type: boolean
          - type: string
            enum:
            - minimal
            - low
            - medium
            - high
            - xhigh
          - type: 'null'
          default: null
          description: Pydantic AI's unified thinking setting, which maps it to the provider's own field (openai_chat sends reasoning_effort;
            DECISIONS-18 entry 3). It sets the effort only. null = not sent, the provider default. llm_call.settings and the trail line
            record the reasoning fields as sent (sent_reasoning), not this value (DECISIONS-23 entry 4).
        thinking_on_timeout:
          oneOf:
          - type: boolean
          - type: string
            enum:
            - minimal
            - low
            - medium
            - high
            - xhigh
          - type: 'null'
          default: null
          description: The thinking setting of the attempt after a slow attempt (call_timeout or stream_stalled; DECISIONS-22 entries 5.3
            and 7). null = the retry keeps `thinking`. The call is degraded when the provider request it gives differs from the first one
            (for gpt-6-luna, minimal is sent as low). A frozen field of conditions/models.yaml, optional there; an entry without it
            has null (CR-91 minor 1).
        system_prompt:
          type:
          - string
          - 'null'
          description: Exploratory runs only. Research runs take the prompt from the condition (prompt_variant). null = the default prompt, written into the stored config at start.
        talk_prompt:
          type:
          - string
          - 'null'
          description: System prompt of the talk call. null = system_prompt. Exploratory runs only; research runs take it from the condition
            (C3 gives the talk call its own instruction). The agent's prompt_hash covers it.
        model_family:
          type: string
          description: Declared by the user, for example openai-gpt or qwen. The API refuses a judge job whose family equals a seller family of
            the run.
    TrailLine:
      type: object
      description: One line of a run's trail.jsonl, for one llm_call (DECISIONS-14 §2). The fields are described under
        GET /runs/{run_id}/export. `messages` is Pydantic AI 2.58 ModelMessages JSON (ModelMessagesTypeAdapter). A line of
        an imported run (POST /imports) has `source`, and seq, request_hash and provider_profile_id null (there is no
        llm_call event and no request); its model is null when the log names none, and key-like strings in its text are
        redacted. The trail view of the web UI has no llm_call event to open such a line from.
      required:
      - trail
      - run_id
      - seq
      - t
      - agent_id
      - purpose
      - attempt
      - request_hash
      - cache_hit
      - model
      - missing
      properties:
        trail:
          const: trail.v1
        run_id:
          type: string
        seq:
          type:
          - integer
          - 'null'
          description: The llm_call event's seq; null in an imported run
        source:
          type: string
          enum:
          - pi
          - rows
          description: Imported runs only, the input format of POST /imports; absent in a simulator run
        t:
          type: integer
        agent_id:
          type: string
        purpose:
          $ref: '#/components/schemas/CallPurpose'
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        sample_index:
          type: integer
        provider_profile_id:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        request_hash:
          type:
          - string
          - 'null'
          description: null in an imported run only
        cache_hit:
          type: boolean
        charged:
          type: boolean
        input_tokens:
          type:
          - integer
          - 'null'
        output_tokens:
          type:
          - integer
          - 'null'
        cached_input_tokens:
          type:
          - integer
          - 'null'
        reasoning_tokens:
          type:
          - integer
          - 'null'
        cost_usd:
          type:
          - number
          - 'null'
        latency_ms:
          type:
          - integer
          - 'null'
        error:
          type:
          - string
          - 'null'
        http_status:
          type:
          - integer
          - 'null'
        provider_code:
          type:
          - string
          - 'null'
        degraded:
          type:
          - boolean
          - 'null'
          description: As llm_call.degraded (DECISIONS-22).
        slot_wait_ms:
          type:
          - integer
          - 'null'
          description: As llm_call.slot_wait_ms (DECISIONS-22).
        first_byte_ms:
          type:
          - integer
          - 'null'
          description: As llm_call.first_byte_ms (DECISIONS-22).
        parallel:
          type:
          - boolean
          - 'null'
          description: As llm_call.parallel (DECISIONS-22).
        provider_message:
          type:
          - string
          - 'null'
          description: As llm_call.provider_message (DECISIONS-24 §3).
        paid_by_run:
          type:
          - string
          - 'null'
          description: The run that paid for the cached reply; null for a failed call.
        finish_reason:
          type:
          - string
          - 'null'
          enum:
          - stop
          - length
          - content_filter
          - tool_call
          - error
          - null
        thinking:
          type:
          - string
          - 'null'
          minLength: 1
          description: Text of the thinking or reasoning parts the provider returned; null when none, never empty.
        thinking_parts:
          type:
          - integer
          - 'null'
          minimum: 0
        allow_text:
          type:
          - boolean
          - 'null'
        settings:
          type:
          - object
          - 'null'
          description: As llm_call.settings (DECISIONS-23 entries 3 and 4), the settings as sent. For an event stored before that
            field, the configured settings from the cache row.
        tools:
          type:
          - array
          - 'null'
          items:
            type: object
            description: Pydantic AI ToolDefinition.
        messages:
          type:
          - array
          - 'null'
          items:
            type: object
            description: Pydantic AI ModelRequest or ModelResponse.
        missing:
          type:
          - string
          - 'null'
          enum:
          - reply
          - no_cache_row
          - unreadable_row
          - null
    CallPurpose:
      type: string
      enum:
      - talk
      - act
      - one_call
      - summary
    ChatMessage:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type:
          - string
          - 'null'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallRecord'
        tool_call_id:
          type: string
    ToolSpec:
      type: object
      required:
      - id
      - version
      - kind
      - roles
      - description
      - params_schema
      - input_schema
      - data_layer
      - counts_as_query
      properties:
        id:
          type: string
        version:
          type: string
        kind:
          type: string
          enum:
          - read
          - write
          description: read tools call View only. write tools return an action that the host applies in the act phase, except
            write_note, which saves the seller's own note during the call (DECISIONS-15 §3.3). Every tool is a pure function on
            the run state (DECISIONS-15 §2).
        roles:
          type: array
          items:
            type: string
        description:
          type: string
          description: Exactly the text sent to the model as the tool description.
        params_schema:
          type: object
          description: JSON Schema of the grant params (the UI grant form).
          additionalProperties: true
        input_schema:
          type: object
          description: JSON Schema of the call arguments (sent to the model).
          additionalProperties: true
        data_layer:
          type: string
          enum:
          - A
          - B
        counts_as_query:
          type: boolean
          description: A read of the record (get_news, get_own_sales, get_rival_prices, read_channel, get_price_history). It uses
            the round's query limit, is never offered in a talk call, and is not offered in observation_mode push. calc_profit,
            write_note and read_note are false and are offered in every call when granted. For write_note and read_note the
            tool_called event records empty arguments and a null result (model-written text); a note's text is a planned event
            with source note.
    PromptPreview:
      type: object
      required:
      - seller_id
      - t
      - purpose
      - messages
      - tools
      - request_hash
      properties:
        seller_id:
          type: string
        t:
          type: integer
        purpose:
          $ref: '#/components/schemas/CallPurpose'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolDefinition'
        request_hash:
          type: string
        placeholder_fields:
          type: array
          items:
            type: string
          description: Parts filled with placeholder data.
    RunKind:
      type: string
      enum:
      - research
      - exploratory
    RunStatus:
      type: string
      enum:
      - queued
      - running
      - paused
      - stopping
      - completed
      - stopped
      - failed
      - recovering
    CallMode:
      type: string
      enum:
      - one_call
      - talk_and_act
      description: 'one_call: one LLM call per seller per round returns message, plan and price. talk_and_act: a talk call, then an act call.
        C3 needs talk_and_act.'
    ChannelSettings:
      type: object
      properties:
        public:
          type: boolean
          default: false
        private_pairs:
          type: boolean
          default: false
          description: One private channel for each pair of sellers.
        news:
          type: boolean
          default: true
          description: The host news channel. false wins over a get_news grant (the run header records the capability
            without it; DECISIONS-15 §3.1). Likewise public and private_pairs false take their channels out of each
            read_channel and post grant, and a grant left with no channel is dropped (so no talk turn). A grant that names
            a channel the run cannot have, or a pair the seller is not in, is refused (422 validation_error; the call plan,
            simcore/callplan.py).
    ClockSettings:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - sync
          - event
        wake_min:
          type: integer
          default: 1
          description: Event mode only.
        wake_max:
          type: integer
          default: 5
          description: Event mode only.
    MemorySettings:
      type: object
      properties:
        full_rounds:
          type: integer
          default: 5
          description: Not used. Each call shows the whole record (DECISIONS-15 §1); the field stays so older configs stay
            valid.
        summary_every:
          type: integer
          default: 5
        summary:
          type:
          - string
          - 'null'
          enum:
          - code
          - llm
          - none
          - null
          default: null
          x-research-locked: true
          description: 'Who writes the memory note every summary_every rounds: code (a fixed template, no model call), llm (one summary call;
            on failure the code note is used) or none (no notes; DECISIONS-15 §1, the observation holds the whole record). Null: an
            exploratory run takes code; a research run takes its condition''s value. A research run that sets another value than its
            condition gets 422 research_field_locked.'
    BudgetSettings:
      type: object
      additionalProperties: false
      description: 'Per run. At least one cap is set. The run stops with end reason budget_exceeded before a call that could pass a cap. A call
        with no price is not seen by max_usd; a run whose only cap is max_usd and whose profile has no price gives 422 budget_unenforceable.'
      properties:
        max_usd:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          title: Max USD
        max_calls:
          type:
          - integer
          - 'null'
          minimum: 1
          title: Max calls
        max_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
          title: Max tokens
          description: Input + output tokens of the run's paid calls (cached input and reasoning included).
    RunLimits:
      type: object
      additionalProperties: false
      description: Per-turn and per-round limits (DECISIONS-8 §2). The smaller of max_messages_per_round and the post grant's max_per_round
        applies, and the smaller of max_queries_per_round and the capability's. acted records which one was hit.
      properties:
        max_steps_per_turn:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Model calls in one call phase. A turn that uses them all ends with a hold (fallback).
        max_messages_per_round:
          type: integer
          minimum: 0
          maximum: 5
          default: 1
        max_queries_per_round:
          type: integer
          minimum: 0
          maximum: 3
          default: 3
    RunConfig:
      type: object
      description: 'Exploratory: scenario_id, scenario_hash and call_mode are required. Research: give condition_id, split and seeds, and
        leave every field that the condition or the seed map sets null (scenario_id, scenario_hash, prompt_variant_id, channels, transparency,
        call_mode, agent capabilities, llm.system_prompt, llm.talk_prompt); a value gives 422 research_field_locked. The server stores one
        resolved config per seed (GET /runs/{run_id} shows it).'
      required:
      - kind
      - seeds
      - agents
      - clock
      - budget
      properties:
        kind:
          $ref: '#/components/schemas/RunKind'
        name:
          type: string
        scenario_id:
          type:
          - string
          - 'null'
          description: Exploratory only. A research run takes each seed's scenario from conditions/seeds.yaml.
        scenario_hash:
          type:
          - string
          - 'null'
          description: Exploratory only. Must match the frozen scenario.
        condition_id:
          type:
          - string
          - 'null'
          description: Required for research runs. Must be null for exploratory runs.
        prompt_variant_id:
          type:
          - string
          - 'null'
          description: Set by the server (seed % 2) in the stored config of a research run. Must be null in a request.
        split:
          $ref: '#/components/schemas/Split'
        seeds:
          type: array
          minItems: 1
          items:
            type: integer
          description: One run per seed. Research seeds must belong to `split` in conditions/seeds.yaml (else 422 seed_not_in_split). Test
            seeds give 409 test_split_locked without a valid freeze, and 409 test_seed_already_run once their (condition, seed) cell was stored by another run. Dev seeds need a frozen condition (409 condition_not_frozen). On dev and test, each seller
            must use its model of conditions/models.yaml for the condition (409 model_not_frozen, path agents/<i>/policy/...), with the same
            profile, model, model_family, temperature, top_p, max_output_tokens, timeout_s and thinking, and the profile's base_url and protocol now equal to the
            file's; a "scripted" entry needs a scripted policy. Planned parents and branch children of dev and test runs are checked again
            when they start. Pilot runs are not checked.
        agents:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/AgentConfig'
          description: At least two sellers. At most one host; if none is given, the scripted host is used.
        channels:
          oneOf:
          - $ref: '#/components/schemas/ChannelSettings'
          - type: 'null'
          description: Exploratory only. Research runs take channels from the condition.
        transparency:
          type:
          - string
          - 'null'
          enum:
          - rival_last_round
          - opaque
          - null
          description: Exploratory only. opaque wins over a get_rival_prices grant (the run header records the capability
            without it; DECISIONS-15 §3.1).
        call_mode:
          oneOf:
          - $ref: '#/components/schemas/CallMode'
          - type: 'null'
          description: Exploratory only (required there). Research runs take it from the condition.
        observation_mode:
          type:
          - string
          - 'null'
          enum:
          - push
          - pull
          - both
          - null
          description: 'Exploratory only; research runs take it from the condition (DECISIONS-15 §3.2). push: each observation holds
            the visible record, and no call offers a read of the record (calc_profit and the notes stay). pull: the observation holds
            only the round and the own last result; the seller reads with its read tools, so every seller needs a query limit above
            0 (else 422). both: the record and the read tools. null: both.'
        clock:
          $ref: '#/components/schemas/ClockSettings'
        memory:
          $ref: '#/components/schemas/MemorySettings'
        limits:
          oneOf:
          - $ref: '#/components/schemas/RunLimits'
          - type: 'null'
          x-research-locked: true
          description: Exploratory only; null uses the defaults. Research runs take the condition's limits.
        budget:
          $ref: '#/components/schemas/BudgetSettings'
        batch_budget:
          oneOf:
          - $ref: '#/components/schemas/BatchBudget'
          - type: 'null'
          description: Shared by every seed of this request (one batch, one guard). Branches do not inherit it. Not part of config_hash.
        snapshot_every:
          type: integer
          default: 1
        notes:
          type: string
        preset_id:
          type:
          - string
          - 'null'
          description: Preset this config came from (recorded in the run).
        opening_price:
          type:
          - number
          - 'null'
          minimum: 0
          description: 'The market price when trading opens, stated once in every seller''s market facts ("When trading opens,
            the market price is {opening_price}."). A reference only: not a cap and not a grid bound. Null: not stated, and left
            out of the config hash (0.42.0).'
        replicate:
          type: integer
          minimum: 0
          default: 0
          description: Replicate number of a rerun (0.45.0). 0 is the first run. The seller call-cache key uses the sample index
            replicate * 1,000,000 + the branch sample index, so a rerun of the same condition and seed makes new calls instead of
            replaying cached replies. 0 is left out of the config hash, so stored hashes do not change.
        indicators:
          type: array
          description: Indicators shown by default in the run view.
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
              params:
                type: object
                additionalProperties: true
    TextBody:
      type: object
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          maxLength: 200000
    JudgeView:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - name
      - description
      properties:
        id:
          type: string
          enum:
          - talk_only
          - talk_prices
          - talk_thinking
        version:
          type: string
        name:
          type: string
        description:
          type: string
    JudgeBlock:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - tag
      - splits
      - views
      - paraphrases
      - cap_per_backend
      - transform
      - cache
      - conditions
      - in_plan
      properties:
        id:
          type: string
          enum:
          - wording
          - main
          - support_one_wording
          - talk_prices
          - stability
          - robustness
          - imported
        name:
          type: string
        tag:
          type: string
          enum:
          - required
          - support
        splits:
          type: array
          items:
            type: string
            enum:
            - pilot
            - dev
            - test
            - exploratory
        views:
          type: array
          items:
            type: string
        paraphrases:
          type: array
          description: 1-based paraphrase indexes the block uses
          items:
            type: integer
            minimum: 1
            maximum: 3
        cap_per_backend:
          type: integer
        transform:
          type: string
          enum:
          - none
          - round_shuffle
        cache:
          type: boolean
          description: false for the stability repeat, which calls again on purpose
        conditions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The condition ids whose episodes the block judges (main and talk_prices C1, C2a, C3-accept;
            support_one_wording C3-silent; DECISIONS-13 §7). null for any condition. Another episode is excluded with
            condition_not_in_block.
        in_plan:
          type: boolean
          description: false for `imported` (runs of POST /imports, split exploratory). Such a block is outside the
            pre-registered plan and the backend cap (cap_per_backend of the ledger is the plan's blocks plus the reserve). Its
            cap_per_backend is per job, its calls have no retry, and the ledger's backend used and held leave them out.
    JudgeItem:
      type: object
      additionalProperties: false
      required:
