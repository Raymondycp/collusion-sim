      - fork_t
      - intervention
      - sample_index
      properties:
        parent_run_id:
          type: string
        fork_t:
          type: number
        intervention:
          $ref: '#/components/schemas/Intervention'
        sample_index:
          type: integer
          description: Part of the call cache key. Placebo children 1..n (fresh draws); probe and ablation children 0..n-1 (child 0 replays the parent's calls until the first changed message). A slow attempt (call_timeout or stream_stalled) stored in the cache replays as the same hold or PASS until the sample_index changes (DECISIONS-22 entry 5.5).
    RunSummary:
      type: object
      required:
      - id
      - kind
      - status
      - scenario_id
      - seed
      - created_at
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the record was archived (DECISIONS-29), null when it is not. Archived records leave the list unless
            include_archived=true (0.39.0).
        hold_reason:
          type:
          - string
          - 'null'
          description: Why this server cannot build the run (for example paid_calls_disabled); the run is then recovering, also
            before its first event. Null otherwise. GET /runs and GET /runs/{run_id} only, not in the export's meta.json (0.40.0).
        id:
          type: string
        batch_id:
          type: string
          pattern: ^batch_[0-9A-HJKMNP-TV-Z]{26}$
        experiment_id:
          type:
          - string
          - 'null'
          description: The experiment that planned this run (its parent or a planned branch child). Null for a run outside an
            experiment, also for a branch that a user starts from an experiment run. Older servers do not send the field.
        kind:
          $ref: '#/components/schemas/RunKind'
        name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/RunStatus'
        condition_id:
          type:
          - string
          - 'null'
        labels:
          oneOf:
          - $ref: '#/components/schemas/Labels'
          - type: 'null'
        split:
          $ref: '#/components/schemas/Split'
        scenario_id:
          type: string
        seed:
          type: integer
        call_mode:
          $ref: '#/components/schemas/CallMode'
        clock_mode:
          type: string
          enum:
          - sync
          - event
        t:
          type:
          - number
          - 'null'
          description: Current round or simulated time.
        max_rounds:
          type: integer
        branch:
          oneOf:
          - $ref: '#/components/schemas/BranchInfo'
          - type: 'null'
        cost_usd:
          type: number
        calls:
          type: integer
        cache_hits:
          type: integer
        fallbacks:
          type: integer
        clamps:
          type: integer
          description: Acted events whose asked price the grid snap changed (asked_price set; DECISIONS-30 §3.3). 0 before contract
            0.41.0.
        created_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        end_reason:
          type:
          - string
          - 'null'
          enum:
          - horizon
          - stopped_by_user
          - budget_exceeded
          - rate_window
          - error
          - null
        preset_id:
          type:
          - string
          - 'null'
        config_hash:
          type: string
        cloned_from:
          type:
          - string
          - 'null'
        demand:
          type: string
          enum:
          - formula
          - agent
        reproducible:
          type: boolean
        models:
          type: array
          items:
            type: string
          description: Distinct LLM models of the run's agents.
        source:
          type: string
          enum:
          - simulator
          - import
          description: import for a run of POST /imports (an outside log; no market state, so no branch). Older servers do
            not send the field.
    ImportCreate:
      type: object
      additionalProperties: false
      required:
      - format
      - files
      properties:
        format:
          type: string
          enum:
          - pi
          - rows
          description: 'pi: one Pi-agent session export (.jsonl) per seller; its post, set_price and hold tool calls are the
            moves, and "Round N" in the last user text is the round. rows: one JSON (a list of rows, or an object with
            rows) or CSV file with speaker, round and optional text, channel (public or private_<A>_<B>), action (a price or
            hold), quantity, profit, thinking, model.'
        files:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: The files' text, at most 20,000,000 characters in all. pi, at least two; seller id (a letter, then up
            to 15 letters, digits or _) to that seller's session. rows, exactly one; file name to text (.csv is read as CSV,
            any other name as JSON).
        name:
          type:
          - string
          - 'null'
          maxLength: 200
        created_at:
          type:
          - string
          - 'null'
          description: rows only. The run's created_at; null is the time of the import. A Pi run takes the earliest
            session start.
        model_families:
          type: object
          additionalProperties:
            type: string
          description: Seller id to the model family of the log's model. A judge job refuses a run whose seller has none
            (judge_same_family), as for LLM runs.
    ImportResult:
      type: object
