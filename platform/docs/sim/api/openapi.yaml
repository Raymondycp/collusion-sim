            - integer
            - 'null'
            description: Cached input tokens included.
          output_tokens:
            type:
            - integer
            - 'null'
            description: Reasoning tokens included.
          cached_input_tokens:
            type:
            - integer
            - 'null'
          reasoning_tokens:
            type:
            - integer
            - 'null'
          cost_usd:
            type:
            - number
            - 'null'
            description: null when the profile has no price. What this run paid for this call. 0 for a cache hit of another run's reply; the cached cost when this run replays a reply it paid for in a round that was not stored.
          latency_ms:
            type:
            - integer
            - 'null'
          error:
            type:
            - string
            - 'null'
            enum:
            - parse_error
            - invalid_tool
            - timeout
            - rate_limit
            - auth
            - not_found
            - provider_error
            - null
            description: 'Category only. auth (HTTP 401 or 403) and not_found (404) stop the run: run_ended has status failed and error auth or not_found.'
          http_status:
            type:
            - integer
            - 'null'
            description: HTTP status of a failed request, when there was one. Null on success and in events stored before 0.22.1.
          provider_code:
            type:
            - string
            - 'null'
            maxLength: 48
            description: The provider's error code or type from the error body, kept only when it matches ^[a-z0-9_.]{1,48}$ (never free text). For a failure with no HTTP status, the name of the exception class (for example APIConnectionError or UnexpectedModelBehavior), or stream_stalled (no data on the stream for 60 s; error provider_error), stream_truncated (the stream ended without the provider's finish; error provider_error) or call_timeout (the whole call passed timeout_s; error timeout) (DECISIONS-21). Null on success and in events stored before 0.22.1.
          degraded:
            type:
            - boolean
            - 'null'
            description: True when the attempt was sent with the model's thinking_on_timeout after a slow attempt (call_timeout or
              stream_stalled) of the same step, and that setting sends other reasoning fields than `thinking` (DECISIONS-22 entries
              5.2 and 7). Null otherwise. A degraded call does not fail the manipulation check; the model check and C1c count it.
          slot_wait_ms:
            type:
            - integer
            - 'null'
            minimum: 0
            description: Wait for a concurrency slot of the profile before the request, in ms (DECISIONS-22 entry 5.8). Null for a cache hit.
          first_byte_ms:
            type:
            - integer
            - 'null'
            minimum: 0
            description: From the request to the first parsed stream event (an SSE comment or ping is not seen), in ms. Null when none
              came or for a cache hit (DECISIONS-22 entry 5.8).
          provider_message:
            type:
            - string
            - 'null'
            maxLength: 200
            description: The provider's error message of a failed request, redacted (runs of 16 or more key-like characters become
              [redacted]) and cut to 200 characters (DECISIONS-24 §3). Null on success and in events stored before this field.
          parallel:
            type:
            - boolean
            - 'null'
            description: True when the call ran at the same time as the other LLM sellers of its phase; false when they ran one after the
              other because the run budget had no room for every seller's worst case (DECISIONS-22 entries 5.6 and 7). Null with one LLM
              seller or outside a seller phase.
          settings:
            type:
            - object
            - 'null'
            additionalProperties: true
            description: The request settings as sent (DECISIONS-23 entries 3 and 4). Pydantic AI renders the request to a capture
              transport (no network call); a configured setting (temperature, top_p, max_tokens, seed) that the request does not
              carry is left out, for example temperature and top_p on an OpenAI reasoning model while reasoning is on. `thinking`
              is replaced by `sent_reasoning`, the provider's reasoning fields in the request (for example the Responses
              protocol's `reasoning` object with effort low). The request_hash covers the configured settings. Null in events stored before this field.
      examples:
      - seq: 20
        run_id: run_01JB7X3K2M
        type: llm_call
        t: 6
        wall_time: '2026-10-23T09:01:12Z'
        tier: B
        agent_id: A
        purpose: act
        request_hash: sha256:7d1e…aa
        sample_index: 0
        cache_hit: false
        attempt: 1
        provider_profile_id: prof_openai_main
        model: gpt-4o-mini
        input_tokens: 1830
        output_tokens: 95
        cost_usd: 0.00033
        latency_ms: 910
        error: null
