      operationId: retryExperiment
      summary: Try the blocked cells again, after their cause is fixed (for example the paid switch is on).
      description: |-
        Forgets every block of the experiment and advances it: planned parents start and completed parents branch. A cell that still
        cannot move on is blocked again with the new error and time. Runs that ended (failed, stopped) are not run again. Safe to call
        at any time; a cell that is not blocked is not changed. Returns the experiment as `GET /experiments/{experiment_id}` does.
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^exp_[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: OK
          content:
