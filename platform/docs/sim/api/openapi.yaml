        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /experiments/{experiment_id}/features:
    get:
      tags:
      - experiments
      operationId: getExperimentFeatures
      summary: The episode feature table (DECISIONS-10 §5) - one row per cell (parent episode), raw values only.
      description: |-
        Label and id columns come from the parent's header; the features never see them. A feature that cannot be computed is null and
        `<id>_missing` gives the reason (a parent that did not complete: `parent_<status>`). `layer=A` is the log-only table (layer-A
        features, access log); `layer=B` has every feature. `meta.features` names each feature's version, layer, access and code hash.
        Two exports of the same experiment are byte-identical. Rows of test seeds give 409 `test_split_locked` without a valid freeze.
        Parquet is not built. With `evaluation_id` (repeat it for several), the LLM judge scores are joined per parent episode as
        `judge_evaluation_id` (the evaluation that judged it), `llm_agreement`, `llm_agreement_share`, `llm_talk_score` and
        `llm_n_ok` (each with `<id>_missing`, `not_judged` for an episode no evaluation judged); `meta.judge` lists the evaluations,
        the wordings per group and the invalid rate per group. Several evaluations merge only with the same item set, view and
        transform, and LLM model and family, and disjoint parents (for example `main` and `support_one_wording`; CR-64 finding 2).
        An unknown evaluation is 404; one with no llm backend, a differing key or a parent judged twice is 422 (path
        evaluation_id/<index>).
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^exp_[0-9A-HJKMNP-TV-Z]{26}$
      - name: layer
        in: query
        schema:
          type: string
          enum:
          - A
          - B
          default: B
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      - name: evaluation_id
        in: query
        style: form
        explode: true
        description: Repeatable; a repeated id counts once
        schema:
          type: array
          items:
            type: string
            pattern: ^eval_[0-9A-Z]{26}$
      responses:
        '200':
          description: OK (format csv - text/csv with the same columns, null as an empty cell)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureTable'
            text/csv:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
