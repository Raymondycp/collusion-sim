    FeatureTable:
      type: object
      required:
      - meta
      - columns
      - rows
      properties:
        meta:
          type: object
          required:
          - experiment_id
          - layer
          - features_code_hash
          - features
          properties:
            experiment_id:
              type: string
            features_code_hash:
              type: string
