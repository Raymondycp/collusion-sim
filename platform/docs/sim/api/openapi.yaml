          news_published: '#/components/schemas/NewsPublishedEvent'
          observed: '#/components/schemas/ObservedEvent'
          llm_call: '#/components/schemas/LlmCallEvent'
          tool_called: '#/components/schemas/ToolCalledEvent'
          posted: '#/components/schemas/PostedEvent'
          talk_replied: '#/components/schemas/TalkRepliedEvent'
          talk_text: '#/components/schemas/TalkTextEvent'
          acted: '#/components/schemas/ActedEvent'
          planned: '#/components/schemas/PlannedEvent'
          settled: '#/components/schemas/SettledEvent'
          reference: '#/components/schemas/ReferenceEvent'
          outcome: '#/components/schemas/OutcomeEvent'
          memory_summarised: '#/components/schemas/MemorySummarisedEvent'
          intervened: '#/components/schemas/IntervenedEvent'
          snapshot_saved: '#/components/schemas/SnapshotSavedEvent'
          budget_warning: '#/components/schemas/BudgetWarningEvent'
          run_status_changed: '#/components/schemas/RunStatusChangedEvent'
          run_ended: '#/components/schemas/RunEndedEvent'
    RunStartedEvent:
