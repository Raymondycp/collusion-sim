    PostedEvent:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - type
        - agent_id
        - channel_id
        - text
        - deliver_t
        properties:
          type:
            const: posted
          agent_id:
            type: string
          channel_id:
            type: string
          text:
            type: string
          deliver_t:
            type: number
            description: Recipients see it from this time.
          receivers:
            type:
            - array
            - 'null'
            items:
              type: string
            description: The agents other than the sender that the message is delivered to, in the order of the channel's
              participants. These are the agents whose observed event in round deliver_t lists the message. An agent gets it when
              it is a participant and its read_channel grant names the channel (the talk call of a c3_isolation run reads it, the
              act call does not). A clear ablation mask active at deliver_t gives []. A post in the last round gives [], because
              the run has no round deliver_t. Under a shuffle mask the receivers get a message from the sender, but its text is
              another message's text. The observed event of each receiver holds the text it saw. The value is set at post time,
              so a run that stops before deliver_t keeps it. C3 participant lists can name more agents than receive. Null in
              episodes written before contract 0.21.0. The episode hash leaves out a null value, so an older episode re-hashes
              to its stored episode_hash.
      examples:
      - seq: 22
        run_id: run_01JB7X3K2M
        type: posted
        t: 6
        wall_time: '2026-10-23T09:01:13Z'
        tier: A
        agent_id: A
        channel_id: private_A_B
        text: Costs went up for both of us. Shall we both go to 10?
        deliver_t: 7
        receivers:
        - B
    TalkRepliedEvent:
      description: >-
        Tier A. How one LLM talk turn ended (0.18.0). With one postable channel the talk call offers no post tool: the
        plain-text reply, with surrounding white space removed, is posted to that channel, and PASS posts nothing. The
        text that reached the channel is in the `posted` event that follows; the judge reads only `posted`. Tier A holds
        no text that was not posted: such reply text is in `talk_text` (tier B, DECISIONS-12 §2a).
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - type
        - agent_id
        - outcome
        properties:
          type:
            const: talk_replied
          agent_id:
            type: string
          channel_id:
            type:
            - string
            - 'null'
            description: Where a plain-text reply is posted; null when the turn uses the post tool (more than one channel).
          outcome:
            type: string
            enum:
            - posted
            - pass
            - empty
            - refused
            - error
            - max_steps
            description: >-
              posted (a message was posted), pass (PASS, or a text reply in a post-tool turn), empty (blank reply),
              refused (the round's message limit was used), error (no usable reply after the retries), max_steps (the
              steps ran out while reading).
          reason:
            type:
            - string
            - 'null'
            enum:
            - timeout
            - error
            - invalid
            - max_steps
            - null
            description: timeout = a PASS that the system recorded after two slow attempts (DECISIONS-22 entry 5.4; the
              manipulation check fails the episode through the feature timeout_fallbacks). Null otherwise.
          text:
            type:
            - string
            - 'null'
            description: The posted text when outcome is posted (several posts joined by a line break), else null.
      examples:
      - seq: 21
        run_id: run_01JB7X3K2M
        type: talk_replied
        t: 6
        wall_time: '2026-10-23T09:01:13Z'
        tier: A
        agent_id: A
        channel_id: private_A_B
        outcome: posted
        text: Costs went up for both of us. Shall we both go to 10?
    TalkTextEvent:
      description: >-
        Tier B (0.18.0). Reply text of an LLM talk call that was not posted: PASS, a reply after the message limit, a
        text reply in a post-tool turn, or the text beside a post call or a refused read. Unchanged. Never a judge or
        feature input.
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - type
        - agent_id
        - text
        properties:
          type:
